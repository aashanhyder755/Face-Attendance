<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Admin</title>

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input, button {
      padding: 12px;
      margin: 5px;
      font-size: 16px;
    }

    input {
      width: 90%;
      max-width: 300px;
    }

    button {
      cursor: pointer;
    }

    #attendanceList {
      margin-top: 20px;
    }

    .record {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
    }

    #status {
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<h1>📋 Teacher Attendance</h1>

<div style="text-align:center;">

  <input
    id="teacherSearch"
    type="text"
    placeholder="Teacher Name"
  >

  <br>

  <input
    id="dateSearch"
    type="text"
    placeholder="Date e.g. 23/09/2026"
  >

  <br>

  <button onclick="filterAttendance()">
    🔎 Search
  </button>

  <button onclick="clearFilters()">
    🔄 Show All
  </button>

  <button onclick="loadAttendance()">
    ☁️ Refresh
  </button>

</div>

<div id="status">
  Attendance loading...
</div>

<div id="attendanceList"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",

  authDomain:
    "teachers-face-attendance.firebaseapp.com",

  projectId:
    "teachers-face-attendance",

  storageBucket:
    "teachers-face-attendance.firebasestorage.app",

  messagingSenderId:
    "63876838606",

  appId:
    "1:63876838606:web:572e240079865aabbc4c9f",

  measurementId:
    "G-XN93NKWLY5"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


let allAttendance = [];


/* Load attendance */

async function loadAttendance() {

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("attendanceList");


  status.innerText =
    "Attendance loading...";


  try {

    const snapshot =
      await getDocs(
        collection(db, "attendance")
      );


    allAttendance = [];


    snapshot.forEach((doc) => {

      allAttendance.push(
        doc.data()
      );

    });


    displayAttendance(
      allAttendance
    );


  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error: " +
      error.message;

  }

}


/* Display */

function displayAttendance(records) {

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("attendanceList");


  if (records.length === 0) {

    status.innerText =
      "No attendance record found.";

    list.innerHTML = "";

    return;

  }


  status.innerText =
    "Total Records: " +
    records.length;


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=
        '<div class="record">' +

        "<b>Teacher:</b> " +
        (record.name || "") +

        "<br>" +

        "<b>Status:</b> " +
        (record.status || "") +

        "<br>" +

        "<b>Date:</b> " +
        (record.date || "") +

        "<br>" +

        "<b>Time:</b> " +
        (record.time || "") +

        "</div>";

    });


  list.innerHTML =
    html;

}


/* Search */

function filterAttendance() {

  const teacher =
    document
      .getElementById("teacherSearch")
      .value
      .trim()
      .toLowerCase();


  const date =
    document
      .getElementById("dateSearch")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allAttendance.filter(function(record) {

      const name =
        (record.name || "")
        .toLowerCase();


      const recordDate =
        (record.date || "")
        .toLowerCase();


      const nameMatch =
        !teacher ||
        name.includes(teacher);


      const dateMatch =
        !date ||
        recordDate.includes(date);


      return nameMatch && dateMatch;

    });


  displayAttendance(
    filtered
  );

}


/* Clear filters */

function clearFilters() {

  document.getElementById(
    "teacherSearch"
  ).value = "";


  document.getElementById(
    "dateSearch"
  ).value = "";


  displayAttendance(
    allAttendance
  );

}


/* Buttons */

window.loadAttendance =
  loadAttendance;

window.filterAttendance =
  filterAttendance;

window.clearFilters =
  clearFilters;


/* Start */

loadAttendance();

</script>

</body>
</html>
