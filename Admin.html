<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Admin</title>

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input, button {
      padding: 12px;
      margin: 5px;
      font-size: 16px;
    }

    input {
      width: 90%;
      max-width: 300px;
    }

    button {
      cursor: pointer;
    }

    #attendanceList {
      margin-top: 20px;
    }

    .record {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
    }

    #status {
      font-weight: bold;
      margin: 15px 0;
    }

    @media print {
      .controls {
        display: none;
      }

      body {
        background: white;
      }

      .record {
        border: 1px solid #000;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>

<h1>📋 Teacher Attendance Report</h1>

<div class="controls" style="text-align:center;">

  <input
    id="teacherSearch"
    type="text"
    placeholder="Teacher Name"
  >

  <br>

  <input
    id="dateSearch"
    type="text"
    placeholder="Date e.g. 23/09/2026"
  >

  <br>

  <button onclick="filterAttendance()">
    🔎 Search
  </button>

  <button onclick="clearFilters()">
    🔄 Show All
  </button>

  <button onclick="loadAttendance()">
    ☁️ Refresh
  </button>

  <br>

  <button onclick="downloadPDF()">
    📄 Download PDF
  </button>

</div>

<div id="status">
  Attendance loading...
</div>

<div id="attendanceList"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {

  apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",

  authDomain:
    "teachers-face-attendance.firebaseapp.com",

  projectId:
    "teachers-face-attendance",

  storageBucket:
    "teachers-face-attendance.firebasestorage.app",

  messagingSenderId:
    "63876838606",

  appId:
    "1:63876838606:web:572e240079865aabbc4c9f",

  measurementId:
    "G-XN93NKWLY5"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


let allAttendance = [];

let currentRecords = [];


/* Load attendance */

async function loadAttendance() {

  const status =
    document.getElementById("status");

  status.innerText =
    "Attendance loading...";


  try {

    const snapshot =
      await getDocs(
        collection(db, "attendance")
      );


    allAttendance = [];


    snapshot.forEach((doc) => {

      allAttendance.push(
        doc.data()
      );

    });


    currentRecords =
      allAttendance;


    displayAttendance(
      allAttendance
    );


  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error: " +
      error.message;

  }

}


/* Display */

function displayAttendance(records) {

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("attendanceList");


  currentRecords = records;


  if (records.length === 0) {

    status.innerText =
      "No attendance record found.";

    list.innerHTML = "";

    return;

  }


  status.innerText =
    "Total Records: " +
    records.length;


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=
        '<div class="record">' +

        "<b>Teacher:</b> " +
        (record.name || "") +

        "<br>" +

        "<b>Status:</b> " +
        (record.status || "") +

        "<br>" +

        "<b>Date:</b> " +
        (record.date || "") +

        "<br>" +

        "<b>Time:</b> " +
        (record.time || "") +

        "</div>";

    });


  list.innerHTML =
    html;

}


/* Search */

function filterAttendance() {

  const teacher =
    document
      .getElementById("teacherSearch")
      .value
      .trim()
      .toLowerCase();


  const date =
    document
      .getElementById("dateSearch")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allAttendance.filter(function(record) {

      const name =
        (record.name || "")
        .toLowerCase();


      const recordDate =
        (record.date || "")
        .toLowerCase();


      const nameMatch =
        !teacher ||
        name.includes(teacher);


      const dateMatch =
        !date ||
        recordDate.includes(date);


      return nameMatch && dateMatch;

    });


  displayAttendance(
    filtered
  );

}


/* Clear filters */

function clearFilters() {

  document.getElementById(
    "teacherSearch"
  ).value = "";


  document.getElementById(
    "dateSearch"
  ).value = "";


  displayAttendance(
    allAttendance
  );

}


/* Download PDF */

function downloadPDF() {

  if (!currentRecords ||
      currentRecords.length === 0) {

    alert(
      "PDF banane ke liye attendance record nahi hai."
    );

    return;

  }


  let teacher =
    document
      .getElementById("teacherSearch")
      .value
      .trim();


  let date =
    document
      .getElementById("dateSearch")
      .value
      .trim();


  let title =
    "Teacher Attendance Report";


  if (teacher) {
    title += " - " + teacher;
  }


  if (date) {
    title += " - " + date;
  }


  let html =
    "<!DOCTYPE html>" +
    "<html><head>" +

    "<meta charset='UTF-8'>" +

    "<title>" +
    title +
    "</title>" +

    "<style>" +

    "body{font-family:Arial;padding:25px;}" +

    "h1{text-align:center;}" +

    "table{width:100%;border-collapse:collapse;margin-top:20px;}" +

    "th,td{border:1px solid #000;padding:10px;text-align:center;}" +

    "th{font-weight:bold;}" +

    "</style>" +

    "</head><body>" +

    "<h1>Moon Star Public High School Khanwahan</h1>" +

    "<h2 style='text-align:center;'>" +
    title +
    "</h2>" +

    "<table>" +

    "<tr>" +
    "<th>Teacher</th>" +
    "<th>Status</th>" +
    "<th>Date</th>" +
    "<th>Time</th>" +
    "</tr>";


  currentRecords
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=
        "<tr>" +

        "<td>" +
        escapeHTML(record.name || "") +
        "</td>" +

        "<td>" +
        escapeHTML(record.status || "") +
        "</td>" +

        "<td>" +
        escapeHTML(record.date || "") +
        "</td>" +

        "<td>" +
        escapeHTML(record.time || "") +
        "</td>" +

        "</tr>";

    });


  html +=
    "</table>" +

    "<p style='margin-top:25px;'>" +
    "<b>Total Records:</b> " +
    currentRecords.length +
    "</p>" +

    "</body></html>";


  const pdfWindow =
    window.open("", "_blank");


  if (!pdfWindow) {

    alert(
      "Popup blocked hai. Browser mein popup allow karein."
    );

    return;

  }


  pdfWindow.document.write(
    html
  );

  pdfWindow.document.close();


  setTimeout(function() {

    pdfWindow.print();

  }, 500);

}


/* Security for names */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* Make functions available */

window.loadAttendance =
  loadAttendance;

window.filterAttendance =
  filterAttendance;

window.clearFilters =
  clearFilters;

window.downloadPDF =
  downloadPDF;


/* Start */

loadAttendance();

</script>

</body>
</html>
