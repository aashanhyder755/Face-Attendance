<!DOCTYPE html>
<html lang="en">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Principal Record - Teacher Attendance</title>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f8;
    color:#222;
}

.header{
    background:#0b5ed7;
    color:white;
    text-align:center;
    padding:20px 10px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:7px 0 0;
    font-size:15px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.section{
    background:white;
    margin-bottom:20px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.section h2{
    margin-top:0;
    color:#0b5ed7;
    border-bottom:2px solid #0b5ed7;
    padding-bottom:10px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

input,
button{
    padding:11px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

input{
    flex:1;
    min-width:160px;
}

button{
    background:#0b5ed7;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.green{
    background:#198754;
}

.orange{
    background:#fd7e14;
}

.gray{
    background:#6c757d;
}

.record{
    border:1px solid #ddd;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
    background:#fafafa;
}

.record strong{
    color:#0b5ed7;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
}

th,
td{
    border:1px solid #aaa;
    padding:7px;
    text-align:center;
    font-size:13px;
}

th{
    background:#e9f1ff;
}

.report{
    border:2px solid #333;
    padding:18px;
    margin-top:15px;
    background:white;
}

.school-name{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:5px;
}

.report-title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.report-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:15px;
}

.no-data{
    text-align:center;
    padding:20px;
    color:#777;
}


@media(max-width:600px){

    .report-info{
        grid-template-columns:1fr;
    }

    table{
        font-size:11px;
    }

    th,
    td{
        padding:5px 3px;
    }

    .school-name{
        font-size:18px;
    }

    .report-title{
        font-size:18px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <h1>
        Moon Star Public High School Khanwahan
    </h1>

    <p>
        Principal Record
    </p>

</div>


<div class="container">


<!-- ================================================= -->
<!-- TEACHER ATTENDANCE -->
<!-- ================================================= -->

<div class="section" id="attendanceSection">

    <h2>
        📋 Teacher Attendance
    </h2>


    <div class="controls">

        <input
            type="text"
            id="teacherSearch"
            placeholder="Search Teacher Name"
        >


        <input
            type="date"
            id="dateSearch"
        >


        <button
            onclick="searchAttendance()"
        >
            🔎 Search
        </button>


        <button
            class="green"
            onclick="loadAttendance()"
        >
            🔄 Refresh
        </button>


        <button
            class="orange"
            onclick="printAttendance()"
        >
            🖨️ Print Attendance
        </button>

    </div>


    <div id="attendanceTotal">
        Total Records: 0
    </div>


    <div id="attendanceList">

        <div class="no-data">
            Loading attendance...
        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- MONTHLY REPORTS -->
<!-- ================================================= -->

<div class="section" id="monthlySection">

    <h2>
        📊 Teacher Monthly Reports
    </h2>


    <div class="controls">

        <input
            type="text"
            id="reportTeacherSearch"
            placeholder="Search Teacher Name"
        >


        <input
            type="month"
            id="reportMonthSearch"
        >


        <button
            onclick="searchReports()"
        >
            🔎 Search Reports
        </button>


        <button
            class="green"
            onclick="loadReports()"
        >
            🔄 Refresh Reports
        </button>


        <button
            class="gray"
            onclick="showAllReports()"
        >
            📋 Show All Reports
        </button>


        <button
            class="orange"
            onclick="printReports()"
        >
            🖨️ Print Reports
        </button>

    </div>


    <div id="reportTotal">
        Total Reports: 0
    </div>


    <div id="reportsList">

        <div class="no-data">
            Loading monthly reports...
        </div>

    </div>

</div>


</div>



<script type="module">


/* ================================================= */
/* FIREBASE */
/* ================================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBguAzVWGP_NUyObdv2Fsreu8pvPycSgzE",

    authDomain:
    "teachers-face-attendance.firebaseapp.com",

    projectId:
    "teachers-face-attendance",

    storageBucket:
    "teachers-face-attendance.firebasestorage.app",

    messagingSenderId:
    "63876838606",

    appId:
    "1:63876838606:web:572e240079865aabbc4c9f",

    measurementId:
    "G-XN93NKWLY5"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



/* ================================================= */
/* ATTENDANCE DATA */
/* ================================================= */

let attendanceData = [];



/* ================================================= */
/* LOAD ATTENDANCE */
/* ================================================= */

async function loadAttendance(){

    const list =
        document.getElementById(
            "attendanceList"
        );


    list.innerHTML =
        '<div class="no-data">Loading attendance...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "attendance"
                )
            );


        attendanceData = [];


        snapshot.forEach(doc=>{

            attendanceData.push({

                id:doc.id,

                ...doc.data()

            });

        });


        displayAttendance(
            attendanceData
        );


    }
    catch(error){

        console.error(error);


        list.innerHTML =
            "<div class='no-data'>" +
            "Attendance load error: " +
            escapeHtml(error.message) +
            "</div>";

    }

}



/* ================================================= */
/* DISPLAY ATTENDANCE */
/* ================================================= */

function displayAttendance(data){

    const list =
        document.getElementById(
            "attendanceList"
        );


    document.getElementById(
        "attendanceTotal"
    ).innerText =
        "Total Records: " +
        data.length;


    if(data.length === 0){

        list.innerHTML =
            '<div class="no-data">' +
            'No attendance records found.' +
            '</div>';

        return;

    }


    data.sort((a,b)=>{

        const aTime =
            (a.date || "") +
            " " +
            (a.time || "");


        const bTime =
            (b.date || "") +
            " " +
            (b.time || "");


        return bTime.localeCompare(
            aTime
        );

    });


    list.innerHTML = "";


    data.forEach(item=>{

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "record";


        div.innerHTML = `

            <strong>Teacher:</strong>
            ${escapeHtml(item.name || "-")}

            <br>

            <strong>Status:</strong>
            ${escapeHtml(item.status || "-")}

            <br>

            <strong>Date:</strong>
            ${escapeHtml(item.date || "-")}

            <br>

            <strong>Time:</strong>
            ${escapeHtml(item.time || "-")}

        `;


        list.appendChild(div);

    });

}



/* ================================================= */
/* SEARCH ATTENDANCE */
/* ================================================= */

function searchAttendance(){

    const name =
        document
        .getElementById(
            "teacherSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const date =
        document
        .getElementById(
            "dateSearch"
        )
        .value
        .trim();


    const filtered =
        attendanceData.filter(
            item=>{

                const itemName =
                    (
                        item.name ||
                        ""
                    )
                    .toLowerCase();


                const itemDate =
                    item.date || "";


                return (

                    (!name ||
                    itemName.includes(name))

                    &&

                    (!date ||
                    itemDate === date)

                );

            }
        );


    displayAttendance(
        filtered
    );

}



/* ================================================= */
/* MONTHLY REPORT DATA */
/* ================================================= */

let reportsData = [];



/* ================================================= */
/* LOAD REPORTS */
/* ================================================= */

async function loadReports(){

    const list =
        document.getElementById(
            "reportsList"
        );


    list.innerHTML =
        '<div class="no-data">' +
        'Loading monthly reports...' +
        '</div>';


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "monthlyReports"
                )
            );


        reportsData = [];


        snapshot.forEach(doc=>{

            reportsData.push({

                id:doc.id,

                ...doc.data()

            });

        });


        displayReports(
            reportsData
        );


    }
    catch(error){

        console.error(error);


        list.innerHTML =
            "<div class='no-data'>" +
            "Monthly reports load error: " +
            escapeHtml(error.message) +
            "</div>";

    }

}



/* ================================================= */
/* DISPLAY REPORTS */
/* ================================================= */

function displayReports(data){

    const list =
        document.getElementById(
            "reportsList"
        );


    document.getElementById(
        "reportTotal"
    ).innerText =
        "Total Reports: " +
        data.length;


    if(data.length === 0){

        list.innerHTML =
            '<div class="no-data">' +
            'No monthly reports found.' +
            '</div>';

        return;

    }


    list.innerHTML = "";


    data.sort((a,b)=>{

        return String(
            b.month || ""
        )
        .localeCompare(
            String(
                a.month || ""
            )
        );

    });


    data.forEach(report=>{

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "report";


        div.innerHTML = `

            <div class="school-name">
                Moon Star Public High School Khanwahan
            </div>


            <div class="report-title">
                Teacher Monthly Report
            </div>


            <div class="report-info">

                <div>

                    <strong>
                        Teacher Name:
                    </strong>

                    <br>

                    ${escapeHtml(
                        report.teacherName || "-"
                    )}

                </div>


                <div>

                    <strong>
                        Month:
                    </strong>

                    <br>

                    ${escapeHtml(
                        report.month || "-"
                    )}

                </div>


                <div>

                    <strong>
                        Class:
                    </strong>

                    <br>

                    ${escapeHtml(
                        report.className || "-"
                    )}

                </div>

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Subject
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Read
                        </th>

                        <th>
                            Write
                        </th>

                        <th>
                            Checked
                        </th>

                        <th>
                            Unchecked
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${subjectRow(
                        "English",
                        report.english
                    )}

                    ${subjectRow(
                        "Urdu",
                        report.urdu
                    )}

                    ${subjectRow(
                        "Math",
                        report.math
                    )}

                    ${subjectRow(
                        "Sindhi",
                        report.sindhi
                    )}

                    ${subjectRow(
                        "S.S.",
                        report.ss
                    )}

                    ${subjectRow(
                        "Islamiat",
                        report.islamiat
                    )}

                    ${subjectRow(
                        "G. Science",
                        report.gscience
                    )}

                </tbody>

            </table>


            <br>


            <div>

                <strong>
                    Teacher Signature:
                </strong>

                ${escapeHtml(
                    report.teacherSignature ||
                    "________________"
                )}

            </div>


            <br>


            <div>

                <strong>
                    Principal:
                </strong>

                ______________________

            </div>

        `;


        list.appendChild(
            div
        );

    });

}



/* ================================================= */
/* SUBJECT ROW */
/* ================================================= */

function subjectRow(
    name,
    data
){

    data =
        data || {};


    return `

        <tr>

            <td>
                ${escapeHtml(name)}
            </td>

            <td>
                ${data.total || 0}
            </td>

            <td>
                ${data.read || 0}
            </td>

            <td>
                ${data.write || 0}
            </td>

            <td>
                ${data.checked || 0}
            </td>

            <td>
                ${data.unchecked || 0}
            </td>

        </tr>

    `;

}



/* ================================================= */
/* SEARCH REPORTS */
/* ================================================= */

function searchReports(){

    const teacher =
        document
        .getElementById(
            "reportTeacherSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const month =
        document
        .getElementById(
            "reportMonthSearch"
        )
        .value
        .trim();


    const filtered =
        reportsData.filter(
            report=>{

                const name =
                    (
                        report.teacherName ||
                        ""
                    )
                    .toLowerCase();


                const reportMonth =
                    report.month || "";


                return (

                    (!teacher ||
                    name.includes(teacher))

                    &&

                    (!month ||
                    reportMonth === month)

                );

            }
        );


    displayReports(
        filtered
    );

}



/* ================================================= */
/* SHOW ALL REPORTS */
/* ================================================= */

function showAllReports(){

    document.getElementById(
        "reportTeacherSearch"
    ).value = "";


    document.getElementById(
        "reportMonthSearch"
    ).value = "";


    displayReports(
        reportsData
    );

}



/* ================================================= */
/* PRINT ATTENDANCE */
/* ================================================= */

function printAttendance(){

    const list =
        document.getElementById(
            "attendanceList"
        );


    const records =
        list.querySelectorAll(
            ".record"
        );


    if(records.length === 0){

        alert(
            "Print karne ke liye attendance record nahi hai."
        );

        return;

    }


    let recordsHTML = "";


    records.forEach(record=>{

        recordsHTML +=
            record.outerHTML;

    });


    const total =
        document.getElementById(
            "attendanceTotal"
        ).innerText;


    const printWindow =
        window.open(
            "",
            "_blank",
            "width=900,height=700"
        );


    if(!printWindow){

        alert(
            "Print window blocked hai. Chrome mein pop-up allow karein."
        );

        return;

    }


    printWindow.document.open();


    printWindow.document.write(`

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Teacher Attendance
</title>


<style>

*{
    box-sizing:border-box;
}

}

<body>

    `);


    printWindow.document.close();

}



/* ================================================= */
/* PRINT MONTHLY REPORTS */
/* ================================================= */

    const list =
        document.getElementById(
            "reportsList"
        );


    const reports =
        list.querySelectorAll(
            ".report"
        );


    if(reports.length === 0){

        alert(
            "Print karne ke liye monthly report nahi hai."
        );

        return;

    }

    reports.forEach(report=>{

        reportsHTML +=
            report.outerHTML;

    });

        document.getElementById(

    const printWindow =
        window.open(
            "",

            "width=1000,height=800"
        );


    if(!printWindow){

        alert(
            "Print window blocked hai. Chrome mein pop-up allow karein."
        );

        return;

    }


    printWindow.document.open();


    printWindow.document.write(`

}

}

}

}



/* ================================================= */
/* ESCAPE HTML */
/* ================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ================================================= */
/* GLOBAL FUNCTIONS */
/* ================================================= */

window.loadAttendance =
    loadAttendance;

window.searchAttendance =
    searchAttendance;

window.printAttendance =
    printAttendance;

window.loadReports =
    loadReports;

window.searchReports =
    searchReports;

window.showAllReports =
    showAllReports;

window.printReports =
    printReports;



/* ================================================= */
/* START */
/* ================================================= */

loadAttendance();

loadReports();


</script>


</body>

</html>
