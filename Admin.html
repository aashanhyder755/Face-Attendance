<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Attendance Admin</title>

<style>

body {
  font-family: Arial, sans-serif;
  padding: 15px;
  background: #f5f5f5;
}

h1 {
  text-align: center;
}

h2 {
  margin-top: 25px;
  text-align: center;
}

.controls {
  text-align: center;
}

input, button {
  padding: 12px;
  margin: 5px;
  font-size: 16px;
  box-sizing: border-box;
}

input {
  width: 90%;
  max-width: 320px;
}

button {
  cursor: pointer;
}

#status,
#reportStatus {
  font-weight: bold;
  margin: 15px 0;
  text-align: center;
}

#attendanceList,
#reportList {
  max-width: 800px;
  margin: auto;
}

.record {
  background: white;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 15px;
  margin: 10px 0;
}

.report-header {
  text-align: center;
  border-bottom: 2px solid #000;
  padding-bottom: 12px;
  margin-bottom: 15px;
}

.report-header h3 {
  margin: 5px 0;
  font-size: 24px;
}

.school-name {
  font-size: 22px;
  font-weight: bold;
}

.report-info {
  margin: 12px 0;
  font-size: 17px;
}

.report-info table {
  width: 100%;
  border-collapse: collapse;
}

.report-info td {
  border: 1px solid #000;
  padding: 8px;
}

.subject-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 15px;
}

.subject-table th,
.subject-table td {
  border: 1px solid #000;
  padding: 9px 5px;
  text-align: center;
}

.subject-table th {
  font-weight: bold;
}

.subject-table th:first-child,
.subject-table td:first-child {
  text-align: left;
}

.signature-area {
  margin-top: 50px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}

.section {
  margin-top: 30px;
}

@media (max-width: 600px) {

  .subject-table {
    font-size: 12px;
  }

  .subject-table th,
  .subject-table td {
    padding: 7px 3px;
  }

  .school-name {
    font-size: 18px;
  }

  .report-header h3 {
    font-size: 20px;
  }

}


/* ================= PRINT ================= */

@media print {

  body {
    background: white;
    padding: 0;
  }

  .controls {
    display: none !important;
  }

  #status,
  #reportStatus {
    display: none;
  }

  body.print-attendance #monthlySection {
    display: none !important;
  }

  body.print-attendance #attendanceSection {
    display: block !important;
  }

  body.print-reports #attendanceSection {
    display: none !important;
  }

  body.print-reports #monthlySection {
    display: block !important;
  }

  body.print-reports #reportList {
    max-width: 100%;
  }

  body.print-reports .record {
    border: 0;
    padding: 0;
    margin: 0;
  }

  body.print-attendance .record {
    border: 1px solid #000;
    border-radius: 0;
    page-break-inside: avoid;
  }

  .section {
    margin-top: 0;
  }

  @page {
    size: A4;
    margin: 15mm;
  }

}

</style>

</head>


<body>


<h1 id="mainSchoolTitle">
Moon Star Public High School Khanwahan
</h1>


<!-- ================= ATTENDANCE ================= -->

<div class="section" id="attendanceSection">

<h2>📋 Teacher Attendance</h2>


<div class="controls">

<input
id="teacherSearch"
type="text"
placeholder="Teacher Name"
>

<br>

<input
id="dateSearch"
type="text"
placeholder="Date e.g. 23/09/2026"
>

<br>

<button id="searchBtn">
🔎 Search
</button>

<button id="showAllBtn">
🔄 Show All
</button>

<button id="refreshBtn">
☁️ Refresh
</button>

<br>

<button id="printAttendanceBtn">
🖨️ Print Attendance
</button>

</div>


<div id="status">
Attendance loading...
</div>


<div id="attendanceList"></div>

</div>


<!-- ================= MONTHLY REPORT ================= -->

<div class="section" id="monthlySection">

<h2>📊 Teacher Monthly Reports</h2>


<div class="controls">

<input
id="reportTeacherSearch"
type="text"
placeholder="Teacher Name"
>

<br>

<input
id="reportMonthSearch"
type="month"
>

<br>

<button id="reportSearchBtn">
🔎 Search Reports
</button>

<button id="reportShowAllBtn">
🔄 Show All Reports
</button>

<button id="reportRefreshBtn">
☁️ Refresh Reports
</button>

<br>

<button id="printReportsBtn">
🖨️ Print Reports
</button>

</div>


<div id="reportStatus">
Reports loading...
</div>


<div id="reportList"></div>

</div>


<script type="module">


/* ================= FIREBASE ================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBguAzVWGP_NUyObdv2Fsreu8pvPycSgzE",

  authDomain:
    "teachers-face-attendance.firebaseapp.com",

  projectId:
    "teachers-face-attendance",

  storageBucket:
    "teachers-face-attendance.firebasestorage.app",

  messagingSenderId:
    "63876838606",

  appId:
    "1:63876838606:web:572e240079865aabbc4c9f",

  measurementId:
    "G-XN93NKWLY5"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* ================= ATTENDANCE ================= */

let allAttendance = [];

let visibleAttendance = [];


async function loadAttendance() {

  const status =
    document.getElementById("status");

  status.innerText =
    "Attendance loading...";


  try {

    const snapshot =
      await getDocs(
        collection(db, "attendance")
      );


    allAttendance = [];


    snapshot.forEach(function(doc) {

      const data = doc.data();


      allAttendance.push({

        name: data.name || "",

        status: data.status || "",

        date: data.date || "",

        time: data.time || ""

      });

    });


    visibleAttendance =
      allAttendance.slice();


    displayAttendance(
      visibleAttendance
    );

  }


  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Error: " +
      error.message;

  }

}


function displayAttendance(records) {

  const status =
    document.getElementById("status");


  const list =
    document.getElementById(
      "attendanceList"
    );


  visibleAttendance =
    records.slice();


  if (records.length === 0) {

    status.innerText =
      "No attendance record found.";

    list.innerHTML = "";

    return;

  }


  status.innerText =
    "Total Records: " +
    records.length;


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=

        '<div class="record">' +

        "<b>Teacher:</b> " +
        escapeHTML(record.name) +
        "<br>" +

        "<b>Status:</b> " +
        escapeHTML(record.status) +
        "<br>" +

        "<b>Date:</b> " +
        escapeHTML(record.date) +
        "<br>" +

        "<b>Time:</b> " +
        escapeHTML(record.time) +

        "</div>";

    });


  list.innerHTML =
    html;

}


function searchAttendance() {

  const teacherInput =
    document
      .getElementById("teacherSearch")
      .value
      .trim()
      .toLowerCase();


  const dateInput =
    document
      .getElementById("dateSearch")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allAttendance.filter(
      function(record) {

        const recordName =
          String(record.name)
            .trim()
            .toLowerCase();


        const recordDate =
          String(record.date)
            .trim()
            .toLowerCase();


        const nameOK =
          teacherInput === "" ||
          recordName.includes(
            teacherInput
          );


        const dateOK =
          dateInput === "" ||
          recordDate.includes(
            dateInput
          );


        return nameOK && dateOK;

      }
    );


  displayAttendance(
    filtered
  );

}


function showAll() {

  document.getElementById(
    "teacherSearch"
  ).value = "";


  document.getElementById(
    "dateSearch"
  ).value = "";


  displayAttendance(
    allAttendance
  );

}


function printAttendance() {

  if (
    !visibleAttendance ||
    visibleAttendance.length === 0
  ) {

    alert(
      "Print ke liye attendance record nahi mila."
    );

    return;

  }


  document.body.classList.add(
    "print-attendance"
  );


  window.print();

}


/* ================= MONTHLY REPORTS ================= */

let allReports = [];

let visibleReports = [];


async function loadReports() {

  const status =
    document.getElementById(
      "reportStatus"
    );


  status.innerText =
    "Reports loading...";


  try {

    const snapshot =
      await getDocs(
        collection(db, "monthlyReports")
      );


    allReports = [];


    snapshot.forEach(function(doc) {

      const data = doc.data();

      allReports.push(data);

    });


    visibleReports =
      allReports.slice();


    displayReports(
      visibleReports
    );

  }


  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Reports error: " +
      error.message;

  }

}


function displayReports(records) {

  const status =
    document.getElementById(
      "reportStatus"
    );


  const list =
    document.getElementById(
      "reportList"
    );


  visibleReports =
    records.slice();


  if (records.length === 0) {

    status.innerText =
      "No monthly report found.";

    list.innerHTML = "";

    return;

  }


  status.innerText =
    "Total Reports: " +
    records.length;


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(function(report) {


      html += `

      <div class="record">

        <div class="report-header">

          <div class="school-name">
            Moon Star Public High School Khanwahan
          </div>

          <h3>
            Teacher Monthly Report
          </h3>

        </div>


        <div class="report-info">

          <table>

            <tr>

              <td>
                <b>Teacher Name</b>
              </td>

              <td>
                ${escapeHTML(report.teacherName || "")}
              </td>

              <td>
                <b>Month</b>
              </td>

              <td>
                ${escapeHTML(report.month || "")}
              </td>

            </tr>


            <tr>

              <td>
                <b>Class</b>
              </td>

              <td colspan="3">
                ${escapeHTML(report.className || "")}
              </td>

            </tr>

          </table>

        </div>


        <table class="subject-table">

          <thead>

            <tr>

              <th>Subject</th>

              <th>Total</th>

              <th>Read</th>

              <th>Write</th>

              <th>Checked</th>

              <th>Unchecked</th>

            </tr>

          </thead>


          <tbody>

            ${subjectRow("English", report.English)}

            ${subjectRow("Urdu", report.Urdu)}

            ${subjectRow("Math", report.Math)}

            ${subjectRow("Sindhi", report.Sindhi)}

            ${subjectRow("S.S.", report["S.S."])}

            ${subjectRow("Islamiat", report.Islamiat)}

            ${subjectRow("G. Science", report["G. Science"])}

          </tbody>

        </table>


        <div class="signature-area">

          <span>
            Teacher Signature: __________
          </span>

          <span>
            Principal: __________
          </span>

        </div>


      </div>

      `;

    });


  list.innerHTML =
    html;

}


function subjectRow(subject, data) {

  if (!data) {

    data = {

      total: "0",

      read: "0",

      write: "0",

      checked: "0",

      unchecked: "0"

    };

  }


  return `

    <tr>

      <td>
        <b>${escapeHTML(subject)}</b>
      </td>

      <td>
        ${escapeHTML(data.total || "0")}
      </td>

      <td>
        ${escapeHTML(data.read || "0")}
      </td>

      <td>
        ${escapeHTML(data.write || "0")}
      </td>

      <td>
        ${escapeHTML(data.checked || "0")}
      </td>

      <td>
        ${escapeHTML(data.unchecked || "0")}
      </td>

    </tr>

  `;

}


function searchReports() {

  const teacher =
    document
      .getElementById(
        "reportTeacherSearch"
      )
      .value
      .trim()
      .toLowerCase();


  const month =
    document
      .getElementById(
        "reportMonthSearch"
      )
      .value;


  const filtered =
    allReports.filter(
      function(report) {

        const reportTeacher =
          String(
            report.teacherName || ""
          )
          .trim()
          .toLowerCase();


        const reportMonth =
          String(
            report.month || ""
          );


        const teacherOK =
          teacher === "" ||
          reportTeacher.includes(
            teacher
          );


        const monthOK =
          month === "" ||
          reportMonth === month;


        return teacherOK && monthOK;

      }
    );


  displayReports(
    filtered
  );

}


function showAllReports() {

  document.getElementById(
    "reportTeacherSearch"
  ).value = "";


  document.getElementById(
    "reportMonthSearch"
  ).value = "";


  displayReports(
    allReports
  );

}


function printReports() {

  if (
    !visibleReports ||
    visibleReports.length === 0
  ) {

    alert(
      "Print ke liye koi monthly report nahi mili."
    );

    return;

  }


  document.body.classList.add(
    "print-reports"
  );


  window.print();

}


/* ================= PRINT CLEANUP ================= */

window.addEventListener(
  "afterprint",
  function() {

    document.body.classList.remove(
      "print-attendance"
    );

    document.body.classList.remove(
      "print-reports"
    );

  }
);


/* ================= SECURITY ================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ================= BUTTONS ================= */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    searchAttendance
  );


document
  .getElementById("showAllBtn")
  .addEventListener(
    "click",
    showAll
  );


document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadAttendance
  );


document
  .getElementById("printAttendanceBtn")
  .addEventListener(
    "click",
    printAttendance
  );


document
  .getElementById("reportSearchBtn")
  .addEventListener(
    "click",
    searchReports
  );


document
  .getElementById("reportShowAllBtn")
  .addEventListener(
    "click",
    showAllReports
  );


document
  .getElementById("reportRefreshBtn")
  .addEventListener(
    "click",
    loadReports
  );


document
  .getElementById("printReportsBtn")
  .addEventListener(
    "click",
    printReports
  );


/* ================= START ================= */

loadAttendance();

loadReports();

</script>

</body>

</html>
