<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Attendance Admin</title>  <style>

    }
  </style></head><body><h1>Moon Star Public High School Khanwahan</h1><!-- ================= ATTENDANCE ================= --><div class="section"><h2>📋 Teacher Attendance</h2><div class="controls"><input
id="teacherSearch"
type="text"
placeholder="Teacher Name"

«»

  <br><input
id="dateSearch"
type="text"
placeholder="Date e.g. 23/09/2026"

«»

  <br><button id="searchBtn">🔎 Search</button>

<button id="showAllBtn">🔄 Show All</button>

<button id="refreshBtn">☁️ Refresh</button>

  <br>  <button id="printAttendanceBtn">
    🖨️ Print Attendance
  </button></div><div id="status">
  Attendance loading...
</div><div id="attendanceList"></div></div><!-- ================= MONTHLY REPORT ================= --><div class="section"><h2>📊 Teacher Monthly Reports</h2><div class="controls"><input
id="reportTeacherSearch"
type="text"
placeholder="Teacher Name"

«»

  <br><input
id="reportMonthSearch"
type="month"

«»

  <br>  <button id="reportSearchBtn">
    🔎 Search Reports
  </button>  <button id="reportShowAllBtn">
    🔄 Show All Reports
  </button>  <button id="reportRefreshBtn">
    ☁️ Refresh Reports
  </button>  <br>  <button id="printReportsBtn">
    🖨️ Print Reports
  </button></div><div id="reportStatus">
  Reports loading...
</div><div id="reportList"></div></div><script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",

  authDomain:
    "teachers-face-attendance.firebaseapp.com",

  projectId:
    "teachers-face-attendance.firebaseapp.com",

  storageBucket:
    "teachers-face-attendance.firebasestorage.app",

  messagingSenderId:
    "63876838606",

  appId:
    "1:63876838606:web:572e240079865aabbc4c9f",

  measurementId:
    "G-XN93NKWLY5"

};


/* Correct project ID */

firebaseConfig.projectId =
  "teachers-face-attendance";


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* ================= ATTENDANCE ================= */

let allAttendance = [];

let visibleAttendance = [];


async function loadAttendance() {

  const status =
    document.getElementById("status");

  status.innerText =
    "Attendance loading...";

  try {

    const snapshot =
      await getDocs(
        collection(db, "attendance")
      );

    allAttendance = [];

    snapshot.forEach(function(doc) {

      const data = doc.data();

      allAttendance.push({

        name: data.name || "",

        status: data.status || "",

        date: data.date || "",

        time: data.time || ""

      });

    });

    visibleAttendance =
      allAttendance.slice();

    displayAttendance(
      visibleAttendance
    );

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Error: " +
      error.message;

  }

}


function displayAttendance(records) {

  const status =
    document.getElementById("status");

  const list =
    document.getElementById(
      "attendanceList"
    );

  visibleAttendance =
    records.slice();


  if (records.length === 0) {

    status.innerText =
      "No attendance record found.";

    list.innerHTML = "";

    return;

  }


  status.innerText =
    "Total Records: " +
    records.length;


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=

        '<div class="record">' +

        "<b>Teacher:</b> " +
        escapeHTML(record.name) +
        "<br>" +

        "<b>Status:</b> " +
        escapeHTML(record.status) +
        "<br>" +

        "<b>Date:</b> " +
        escapeHTML(record.date) +
        "<br>" +

        "<b>Time:</b> " +
        escapeHTML(record.time) +

        "</div>";

    });


  list.innerHTML = html;

}


function searchAttendance() {

  const teacherInput =
    document
      .getElementById("teacherSearch")
      .value
      .trim()
      .toLowerCase();


  const dateInput =
    document
      .getElementById("dateSearch")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allAttendance.filter(
      function(record) {

        const recordName =
          String(record.name)
            .trim()
            .toLowerCase();

        const recordDate =
          String(record.date)
            .trim()
            .toLowerCase();

        const nameOK =
          teacherInput === "" ||
          recordName.includes(
            teacherInput
          );

        const dateOK =
          dateInput === "" ||
          recordDate.includes(
            dateInput
          );

        return nameOK && dateOK;

      }
    );


  displayAttendance(filtered);

}


function showAll() {

  document.getElementById(
    "teacherSearch"
  ).value = "";

  document.getElementById(
    "dateSearch"
  ).value = "";

  displayAttendance(
    allAttendance
  );

}


function printAttendance() {

  if (
    !visibleAttendance ||
    visibleAttendance.length === 0
  ) {

    alert(
      "Print ke liye attendance record nahi mila."
    );

    return;

  }

  window.print();

}


/* ================= MONTHLY REPORTS ================= */

let allReports = [];

let visibleReports = [];


async function loadReports() {

  const status =
    document.getElementById(
      "reportStatus"
    );

  status.innerText =
    "Reports loading...";

  try {

    const snapshot =
      await getDocs(
        collection(db, "monthlyReports")
      );

    allReports = [];

    snapshot.forEach(function(doc) {

      const data = doc.data();

      allReports.push(data);

    });

    visibleReports =
      allReports.slice();

    displayReports(
      visibleReports
    );

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Reports error: " +
      error.message;

  }

}


function displayReports(records) {

  const status =
    document.getElementById(
      "reportStatus"
    );

  const list =
    document.getElementById(
      "reportList"
    );

  visibleReports =
    records.slice();


  if (records.length === 0) {

    status.innerText =
      "No monthly report found.";

    list.innerHTML = "";

    return;

  }


  status.innerText =
    "Total Reports: " +
    records.length;


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(function(report) {

      html +=
        '<div class="record">' +

        "<h3>Teacher Monthly Report</h3>" +

        "<b>Teacher Name:</b> " +
        escapeHTML(report.teacherName || "") +
        "<br>" +

        "<b>Month:</b> " +
        escapeHTML(report.month || "") +
        "<br>" +

        "<b>Class:</b> " +
        escapeHTML(report.className || "") +
        "<br>";


      html += subjectHTML(
        "English",
        report.English
      );

      html += subjectHTML(
        "Urdu",
        report.Urdu
      );

      html += subjectHTML(
        "Math",
        report.Math
      );

      html += subjectHTML(
        "Sindhi",
        report.Sindhi
      );

      html += subjectHTML(
        "S.S.",
        report.SS
      );

      html += subjectHTML(
        "Islamiat",
        report.Islamiat
      );

      html += subjectHTML(
        "G. Science",
        report.GScience
      );


      html +=
        "</div>";

    });


  list.innerHTML =
    html;

}


function subjectHTML(
  subject,
  data
) {

  if (!data) {
    return "";
  }


  return `
    <div class="subject">

      <b>${escapeHTML(subject)}</b><br>

      Total:
      ${escapeHTML(data.total || "0")}
      &nbsp; | &nbsp;

      Read:
      ${escapeHTML(data.read || "0")}
      &nbsp; | &nbsp;

      Write:
      ${escapeHTML(data.write || "0")}
      &nbsp; | &nbsp;

      Checked:
      ${escapeHTML(data.checked || "0")}
      &nbsp; | &nbsp;

      Unchecked:
      ${escapeHTML(data.unchecked || "0")}

    </div>
  `;

}


function searchReports() {

  const teacher =
    document
      .getElementById(
        "reportTeacherSearch"
      )
      .value
      .trim()
      .toLowerCase();


  const month =
    document
      .getElementById(
        "reportMonthSearch"
      )
      .value;


  const filtered =
    allReports.filter(
      function(report) {

        const reportTeacher =
          String(
            report.teacherName || ""
          )
          .trim()
          .toLowerCase();


        const reportMonth =
          String(
            report.month || ""
          );


        const teacherOK =
          teacher === "" ||
          reportTeacher.includes(
            teacher
          );


        const monthOK =
          month === "" ||
          reportMonth === month;


        return teacherOK && monthOK;

      }
    );


  displayReports(
    filtered
  );

}


function showAllReports() {

  document.getElementById(
    "reportTeacherSearch"
  ).value = "";

  document.getElementById(
    "reportMonthSearch"
  ).value = "";

  displayReports(
    allReports
  );

}


function printReports() {

  if (
    !visibleReports ||
    visibleReports.length === 0
  ) {

    alert(
      "Print ke liye koi monthly report nahi mili."
    );

    return;

  }

  window.print();

}


/* ================= SECURITY ================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ================= BUTTONS ================= */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    searchAttendance
  );


document
  .getElementById("showAllBtn")
  .addEventListener(
    "click",
    showAll
  );


document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadAttendance
  );


document
  .getElementById("printAttendanceBtn")
  .addEventListener(
    "click",
    printAttendance
  );


document
  .getElementById("reportSearchBtn")
  .addEventListener(
    "click",
    searchReports
  );


document
  .getElementById("reportShowAllBtn")
  .addEventListener(
    "click",
    showAllReports
  );


document
  .getElementById("reportRefreshBtn")
  .addEventListener(
    "click",
    loadReports
  );


document
  .getElementById("printReportsBtn")
  .addEventListener(
    "click",
    printReports
  );


/* ================= START ================= */

loadAttendance();

loadReports();

</body>
