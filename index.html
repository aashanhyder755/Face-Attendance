<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers Face Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e8f1ff,#f7fbff);
    min-height:100vh;
    color:#222;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    margin-top:20px;
}

h1,h2,h3{
    text-align:center;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.back{
    background:#555;
}

.danger{
    background:#d32f2f;
}

.success{
    background:#2e7d32;
}

.video-box{
    width:100%;
    background:#111;
    border-radius:15px;
    overflow:hidden;
    margin:15px 0;
}

video{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

.status{
    text-align:center;
    padding:10px;
    font-weight:bold;
    min-height:25px;
}

.hidden{
    display:none !important;
}

.school{
    text-align:center;
    font-size:14px;
    color:#555;
    margin-bottom:15px;
}

.welcome{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
}

.menu-btn{
    font-size:17px;
    padding:16px;
}

.small{
    font-size:13px;
    color:#666;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="card">

    <h1>👨‍🏫 Teacher Login</h1>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <input
        type="email"
        id="email"
        placeholder="Teacher Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        🔐 Login
    </button>

    <div id="loginStatus" class="status"></div>

</div>


<!-- ================= MENU ================= -->

<div id="menuPage" class="card hidden">

    <h1>👨‍🏫 Teachers Face Attendance</h1>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div id="welcomeText" class="welcome">
        Welcome
    </div>

    <button
        class="menu-btn"
        onclick="openFaceRegistration()"
    >
        👤 Face Registration
    </button>

    <button
        class="menu-btn"
        onclick="openMarkAttendance()"
    >
        📷 Mark Attendance
    </button>

    <button
        class="menu-btn"
        onclick="openPrincipalRecord()"
    >
        📊 Principal Record
    </button>

    <button
        class="danger"
        onclick="logout()"
    >
        🚪 Logout
    </button>

</div>


<!-- ================= FACE REGISTRATION ================= -->

<div id="faceRegistrationPage" class="card hidden">

    <h2>👤 Face Registration</h2>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div id="registrationTeacher"
         class="welcome">
        Teacher
    </div>

    <div class="video-box">
        <video
            id="registrationVideo"
            autoplay
            muted
            playsinline>
        </video>
    </div>

    <button
        id="registrationStartBtn"
        onclick="startRegistrationCamera()">
        📷 Start Camera
    </button>

    <button
        id="registerFaceBtn"
        class="success"
        onclick="registerFace()">
        👤 Register My Face
    </button>

    <div id="registrationStatus"
         class="status">
    </div>

    <button
        class="back"
        onclick="goToMenu()">
        ← Back
    </button>

</div>


<!-- ================= MARK ATTENDANCE ================= -->

<div id="markAttendancePage" class="card hidden">

    <h2>📷 Mark Attendance</h2>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div id="attendanceTeacher"
         class="welcome">
        Teacher
    </div>

    <div class="video-box">
        <video
            id="attendanceVideo"
            autoplay
            muted
            playsinline>
        </video>
    </div>

    <button
        id="attendanceStartBtn"
        onclick="startAttendanceCamera()">
        📷 Start Camera
    </button>

    <button
        id="attendanceMarkBtn"
        class="success"
        onclick="markAttendance()">
        ✅ Mark Attendance
    </button>

    <div id="attendanceStatus"
         class="status">
    </div>

    <button
        class="back"
        onclick="goToMenu()">
        ← Back
    </button>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
=====================================================
IMPORTANT:

YAHAN APNE CURRENT WORKING FIREBASE CONFIG KE
ACTUAL VALUES RAKHEIN.

YOUR_API_KEY WAGHERA NAHI RAKHNA.
APNE PURANE WORKING CODE WALI VALUES USE KAREIN.
=====================================================
*/

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "teachers-face-attendance.firebaseapp.com",
    projectId: "teachers-face-attendance",
    storageBucket: "teachers-face-attendance.firebasestorage.app",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser =
    localStorage.getItem("teacherName") || "";

let registrationStream = null;
let attendanceStream = null;

let modelsLoaded = false;


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
    document.getElementById("loginPage");

const menuPage =
    document.getElementById("menuPage");

const faceRegistrationPage =
    document.getElementById("faceRegistrationPage");

const markAttendancePage =
    document.getElementById("markAttendancePage");


/* =====================================================
   SHOW ONLY ONE PAGE
===================================================== */

function showOnly(page){

    loginPage.classList.add("hidden");
    menuPage.classList.add("hidden");
    faceRegistrationPage.classList.add("hidden");
    markAttendancePage.classList.add("hidden");

    page.classList.remove("hidden");
}


/* =====================================================
   LOGIN
===================================================== */

window.login = function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const status =
        document.getElementById("loginStatus");

    if(
        email === "ashfaque.thebo@gmail.com" &&
        password === "123456789"
    ){

        currentUser = "Ashfaque";

        localStorage.setItem(
            "teacherName",
            currentUser
        );

        localStorage.setItem(
            "teacherLoggedIn",
            "true"
        );

        document.getElementById(
            "welcomeText"
        ).innerText =
            "Welcome " + currentUser;

        showOnly(menuPage);

        status.innerText = "";

    }else{

        status.innerText =
            "❌ Email ya password ghalat hai.";

    }
};


/* =====================================================
   LOGOUT
===================================================== */

window.logout = function(){

    localStorage.removeItem("teacherName");
    localStorage.removeItem("teacherLoggedIn");

    currentUser = "";

    stopAllCameras();

    showOnly(loginPage);
};


/* =====================================================
   GET TEACHER NAME
===================================================== */

function getTeacherName(){

    /*
    IMPORTANT:

    YAHAN LOGIN CHECK NAHI HAI.

    Agar teacherName localStorage mein na bhi ho,
    Face Registration aur Attendance phir bhi khulenge.
    */

    return (
        localStorage.getItem("teacherName")
        || currentUser
        || "Ashfaque"
    );
}


/* =====================================================
   MENU
===================================================== */

window.goToMenu = function(){

    stopAllCameras();

    const name = getTeacherName();

    currentUser = name;

    document.getElementById(
        "welcomeText"
    ).innerText =
        "Welcome " + name;

    showOnly(menuPage);
};


/* =====================================================
   FACE REGISTRATION
   NO LOGIN CHECK
===================================================== */

window.openFaceRegistration = function(){

    /*
    YAHAN KOI LOGIN CHECK NAHI HAI.
    */

    currentUser = getTeacherName();

    document.getElementById(
        "registrationTeacher"
    ).innerText =
        "Teacher: " + currentUser;

    document.getElementById(
        "registrationStatus"
    ).innerText = "";

    showOnly(faceRegistrationPage);
};


/* =====================================================
   MARK ATTENDANCE
   NO LOGIN CHECK
===================================================== */

window.openMarkAttendance = function(){

    /*
    YAHAN BHI KOI LOGIN CHECK NAHI HAI.
    */

    currentUser = getTeacherName();

    document.getElementById(
        "attendanceTeacher"
    ).innerText =
        "Teacher: " + currentUser;

    document.getElementById(
        "attendanceStatus"
    ).innerText = "";

    showOnly(markAttendancePage);
};


/* =====================================================
   PRINCIPAL RECORD
===================================================== */

window.openPrincipalRecord = function(){

    window.location.href = "Admin.html";

};


/* =====================================================
   LOAD FACE API MODELS
===================================================== */

async function loadModels(){

    if(modelsLoaded){
        return;
    }

    try{

        await faceapi.nets.tinyFaceDetector.loadFromUri(
            "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
        );

        await faceapi.nets.faceLandmark68Net.loadFromUri(
            "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
        );

        await faceapi.nets.faceRecognitionNet.loadFromUri(
            "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
        );

        modelsLoaded = true;

    }catch(error){

        console.error(
            "Model loading error:",
            error
        );

        throw error;
    }
}


/* =====================================================
   FACE REGISTRATION CAMERA
   NO LOGIN CHECK
===================================================== */

window.startRegistrationCamera = async function(){

    const status =
        document.getElementById(
            "registrationStatus"
        );

    try{

        status.innerText =
            "⏳ Camera start ho raha hai...";

        await loadModels();

        if(registrationStream){

            registrationStream
                .getTracks()
                .forEach(track => track.stop());

        }

        registrationStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        const video =
            document.getElementById(
                "registrationVideo"
            );

        video.srcObject =
            registrationStream;

        await video.play();

        status.innerText =
            "✅ Camera ready hai. Face camera ke samne rakhein.";

    }catch(error){

        console.error(error);

        status.innerText =
            "❌ Camera start nahi hua: " +
            error.message;

    }
};


/* =====================================================
   REGISTER FACE
   NO LOGIN CHECK
===================================================== */

window.registerFace = async function(){

    const status =
        document.getElementById(
            "registrationStatus"
        );

    try{

        status.innerText =
            "🔍 Face detect ho raha hai...";

        await loadModels();

        const video =
            document.getElementById(
                "registrationVideo"
            );

        if(!video.srcObject){

            status.innerText =
                "❌ Pehle Start Camera dabayein.";

            return;
        }

        let detection = null;

        for(let i=0;i<10;i++){

            detection =
                await faceapi
                    .detectSingleFace(
                        video,
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize:320,
                            scoreThreshold:0.4
                        })
                    )
                    .withFaceLandmarks()
                    .withFaceDescriptor();

            if(detection){
                break;
            }

            await new Promise(
                resolve => setTimeout(resolve,500)
            );
        }

        if(!detection){

            status.innerText =
                "❌ Face detect nahi hua. Camera ke samne seedha dekhein.";

            return;
        }

        const descriptor =
            Array.from(
                detection.descriptor
            );

        const teacherName =
            getTeacherName();

        /* Check existing face */

        const faceQuery =
            query(
                collection(db,"teacherFaces"),
                where("name","==",teacherName)
            );

        const existing =
            await getDocs(faceQuery);

        if(!existing.empty){

            status.innerText =
                "⚠️ " +
                teacherName +
                " ka face pehle se registered hai.";

            return;
        }

        await addDoc(
            collection(db,"teacherFaces"),
            {
                name:teacherName,
                descriptor:descriptor,
                createdAt:new Date().toISOString()
            }
        );

        status.innerText =
            "✅ " +
            teacherName +
            " ka face successfully register ho gaya.";

    }catch(error){

        console.error(error);

        status.innerText =
            "❌ Registration error: " +
            error.message;

    }
};


/* =====================================================
   ATTENDANCE CAMERA
   NO LOGIN CHECK
===================================================== */

window.startAttendanceCamera = async function(){

    const status =
        document.getElementById(
            "attendanceStatus"
        );

    try{

        status.innerText =
            "⏳ Camera start ho raha hai...";

        await loadModels();

        if(attendanceStream){

            attendanceStream
                .getTracks()
                .forEach(track => track.stop());

        }

        attendanceStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        const video =
            document.getElementById(
                "attendanceVideo"
            );

        video.srcObject =
            attendanceStream;

        await video.play();

        status.innerText =
            "✅ Camera ready hai. Face camera ke samne rakhein.";

    }catch(error){

        console.error(error);

        status.innerText =
            "❌ Camera start nahi hua: " +
            error.message;

    }
};


/* =====================================================
   MARK ATTENDANCE
   NO LOGIN CHECK
===================================================== */

window.markAttendance = async function(){

    const status =
        document.getElementById(
            "attendanceStatus"
        );

    try{

        status.innerText =
            "🔍 Face match ho raha hai...";

        await loadModels();

        const teacherName =
            getTeacherName();

        const video =
            document.getElementById(
                "attendanceVideo"
            );

        if(!video.srcObject){

            status.innerText =
                "❌ Pehle Start Camera dabayein.";

            return;
        }

        /* Get registered face */

        const faceQuery =
            query(
                collection(db,"teacherFaces"),
                where("name","==",teacherName)
            );

        const faceSnapshot =
            await getDocs(faceQuery);

        if(faceSnapshot.empty){

            status.innerText =
                "❌ Is teacher ka face registered nahi hai.";

            return;
        }

        const faceData =
            faceSnapshot.docs[0].data();

        const registeredDescriptor =
            new Float32Array(
                faceData.descriptor
            );


        /* Detect live face */

        let detection = null;

        for(let i=0;i<15;i++){

            detection =
                await faceapi
                    .detectSingleFace(
                        video,
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize:320,
                            scoreThreshold:0.4
                        })
                    )
                    .withFaceLandmarks()
                    .withFaceDescriptor();

            if(detection){
                break;
            }

            await new Promise(
                resolve => setTimeout(resolve,500)
            );
        }

        if(!detection){

            status.innerText =
                "❌ Face detect nahi hua.";

            return;
        }


        /* Compare face */

        const distance =
            faceapi.euclideanDistance(
                registeredDescriptor,
                detection.descriptor
            );

        console.log(
            "Face distance:",
            distance
        );


        if(distance > 0.55){

            status.innerText =
                "❌ Face match nahi hua.";

            return;
        }


        /* Current date/time */

        const now =
            new Date();

        const date =
            String(now.getDate()).padStart(2,"0")
            + "/" +
            String(now.getMonth()+1).padStart(2,"0")
            + "/" +
            now.getFullYear();

        const time =
            String(now.getHours()).padStart(2,"0")
            + ":" +
            String(now.getMinutes()).padStart(2,"0")
            + ":" +
            String(now.getSeconds()).padStart(2,"0");


        /* Duplicate check */

        const attendanceQuery =
            query(
                collection(db,"attendance"),
                where("name","==",teacherName),
                where("date","==",date)
            );

        const attendanceSnapshot =
            await getDocs(attendanceQuery);

        if(!attendanceSnapshot.empty){

            status.innerText =
                "⚠️ " +
                teacherName +
                " ki aaj ki attendance pehle se lagi hui hai.";

            return;
        }


        /* Save attendance */

        await addDoc(
            collection(db,"attendance"),
            {
                name:teacherName,
                status:"Present",
                date:date,
                time:time
            }
        );

        status.innerText =
            "✅ Attendance successfully save ho gayi.";

    }catch(error){

        console.error(error);

        status.innerText =
            "❌ Attendance error: " +
            error.message;

    }
};


/* =====================================================
   STOP CAMERAS
===================================================== */

function stopAllCameras(){

    if(registrationStream){

        registrationStream
            .getTracks()
            .forEach(track => track.stop());

        registrationStream = null;
    }

    if(attendanceStream){

        attendanceStream
            .getTracks()
            .forEach(track => track.stop());

        attendanceStream = null;
    }
}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        const loggedIn =
            localStorage.getItem(
                "teacherLoggedIn"
            );

        const savedName =
            localStorage.getItem(
                "teacherName"
            );

        if(
            loggedIn === "true" &&
            savedName
        ){

            currentUser =
                savedName;

            document.getElementById(
                "welcomeText"
            ).innerText =
                "Welcome " + currentUser;

            showOnly(menuPage);

        }else{

            showOnly(loginPage);

        }

    }
);

</script>

</body>
</html>
