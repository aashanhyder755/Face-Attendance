<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Attendance</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 15px;
    }

    video {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Face Attendance</h1>

  <video id="camera" autoplay muted playsinline></video>

  <br>

  <button onclick="startCamera()">Start Camera</button>
  <button onclick="stopCamera()">Stop Camera</button>

  <h2 id="status">Camera not started</h2>

  <script>
    let stream = null;

    async function startCamera() {
      const video = document.getElementById("camera");
      const status = document.getElementById("status");

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          status.innerText = "Camera is not supported in this browser.";
          return;
        }

        status.innerText = "Requesting camera permission...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        await video.play();

        status.innerText = "Camera started successfully ✅";

      } catch (error) {
        console.log(error);

        if (error.name === "NotAllowedError") {
          status.innerText = "Camera permission denied. Allow camera permission.";
        } else if (error.name === "NotFoundError") {
          status.innerText = "No camera found.";
        } else if (error.name === "NotReadableError") {
          status.innerText = "Camera is being used by another app.";
        } else {
          status.innerText = "Camera error: " + error.name;
        }
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      document.getElementById("camera").srcObject = null;
      document.getElementById("status").innerText = "Camera stopped";
    }
  </script>

</body>
</html>
