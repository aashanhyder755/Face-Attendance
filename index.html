<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers Face Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e8f1ff,#f7fbff);
    min-height:100vh;
    color:#222;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-top:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.hidden{
    display:none !important;
}

h1{
    text-align:center;
    font-size:25px;
}

h2{
    text-align:center;
}

.school{
    text-align:center;
    color:#555;
    margin-bottom:20px;
    font-size:14px;
}

.welcome{
    text-align:center;
    font-size:19px;
    font-weight:bold;
    margin:15px 0;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:0;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.green{
    background:#2e7d32;
}

.red{
    background:#d32f2f;
}

.gray{
    background:#555;
}

.status{
    min-height:28px;
    text-align:center;
    padding:8px;
    font-weight:bold;
}

.videoBox{
    width:100%;
    background:#111;
    border-radius:15px;
    overflow:hidden;
    margin:15px 0;
}

video{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

</style>

</head>

<body>

<div class="container">


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage" class="card">

    <h1>👨‍🏫 Teacher Login</h1>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <input
        type="email"
        id="email"
        placeholder="Teacher Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        🔐 Login
    </button>

    <div id="loginStatus" class="status"></div>

</div>


<!-- =====================================================
     TEACHER MENU
===================================================== -->

<div id="menuPage" class="card hidden">

    <h1>👨‍🏫 Teachers Face Attendance</h1>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div id="welcomeText" class="welcome">
        Welcome
    </div>

    <button onclick="openFaceRegistration()">
        👤 Face Registration
    </button>

    <button onclick="openMarkAttendance()">
        📷 Mark Attendance
    </button>

    <button onclick="openPrincipalRecord()">
        📊 Principal Record
    </button>

    <button class="red" onclick="logout()">
        🚪 Logout
    </button>

</div>


<!-- =====================================================
     FACE REGISTRATION
===================================================== -->

<div id="faceRegistration" class="card hidden">

    <h2>👤 Face Registration</h2>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div id="registrationTeacher"
         class="welcome">
        Teacher
    </div>

    <div class="videoBox">

        <video
            id="registrationVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>

    <button onclick="startRegistrationCamera()">
        📷 Start Camera
    </button>

    <button
        class="green"
        onclick="registerFace()">
        👤 Register My Face
    </button>

    <div
        id="registrationStatus"
        class="status">
    </div>

    <button
        class="gray"
        onclick="goMenu()">
        ← Back
    </button>

</div>


<!-- =====================================================
     MARK ATTENDANCE
===================================================== -->

<div id="markAttendance" class="card hidden">

    <h2>📷 Mark Attendance</h2>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div id="attendanceTeacher"
         class="welcome">
        Teacher
    </div>

    <div class="videoBox">

        <video
            id="attendanceVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>

    <button onclick="startAttendanceCamera()">
        📷 Start Camera
    </button>

    <button
        class="green"
        onclick="markAttendance()">
        ✅ Mark Attendance
    </button>

    <div
        id="attendanceStatus"
        class="status">
    </div>

    <button
        class="gray"
        onclick="goMenu()">
        ← Back
    </button>

</div>


</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
=========================================================
IMPORTANT

YAHAN APNE CURRENT WORKING FIREBASE CONFIG KI VALUES
RAKHEIN.

apiKey
messagingSenderId
appId

IN TEENO KO APNE PURANE WORKING CODE SE COPY KAREIN.
=========================================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "teachers-face-attendance.firebaseapp.com",

    projectId:
        "teachers-face-attendance",

    storageBucket:
        "teachers-face-attendance.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser =
    localStorage.getItem("teacherName") || "";

let registrationStream = null;

let attendanceStream = null;

let modelsLoaded = false;


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const loginPage =
    document.getElementById("loginPage");

const menuPage =
    document.getElementById("menuPage");

const faceRegistration =
    document.getElementById("faceRegistration");

const markAttendancePage =
    document.getElementById("markAttendance");


/* =====================================================
   SHOW PAGE
===================================================== */

function showPage(page){

    loginPage.classList.add("hidden");

    menuPage.classList.add("hidden");

    faceRegistration.classList.add("hidden");

    markAttendancePage.classList.add("hidden");

    page.classList.remove("hidden");
}


/* =====================================================
   TEACHER NAME
===================================================== */

function getTeacherName(){

    let name =
        localStorage.getItem("teacherName");

    if(!name){

        name = currentUser;

    }

    if(!name){

        name = "Ashfaque";

    }

    currentUser = name;

    return name;
}


/* =====================================================
   LOGIN
===================================================== */

window.login = function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value
        .trim();

    const status =
        document
        .getElementById("loginStatus");


    if(
        email === "ashfaque.thebo@gmail.com"
        &&
        password === "123456789"
    ){

        currentUser = "Ashfaque";

        localStorage.setItem(
            "teacherName",
            currentUser
        );

        localStorage.setItem(
            "teacherLoggedIn",
            "true"
        );

        document
        .getElementById("welcomeText")
        .innerText =
            "Welcome " + currentUser;

        showPage(menuPage);

        status.innerText = "";

    }
    else{

        status.innerText =
            "❌ Email ya password ghalat hai.";

    }

};


/* =====================================================
   LOGOUT
===================================================== */

window.logout = function(){

    localStorage.removeItem(
        "teacherName"
    );

    localStorage.removeItem(
        "teacherLoggedIn"
    );

    currentUser = "";

    stopCameras();

    showPage(loginPage);

};


/* =====================================================
   MENU
===================================================== */

window.goMenu = function(){

    stopCameras();

    const name =
        getTeacherName();

    document
    .getElementById("welcomeText")
    .innerText =
        "Welcome " + name;

    showPage(menuPage);

};


/* =====================================================
   FACE REGISTRATION
   IMPORTANT:
   NO LOGIN CHECK
===================================================== */

window.openFaceRegistration = function(){

    const name =
        getTeacherName();

    document
    .getElementById(
        "registrationTeacher"
    )
    .innerText =
        "Teacher: " + name;

    document
    .getElementById(
        "registrationStatus"
    )
    .innerText = "";

    showPage(faceRegistration);

};


/* =====================================================
   MARK ATTENDANCE
   IMPORTANT:
   NO LOGIN CHECK
===================================================== */

window.openMarkAttendance = function(){

    const name =
        getTeacherName();

    document
    .getElementById(
        "attendanceTeacher"
    )
    .innerText =
        "Teacher: " + name;

    document
    .getElementById(
        "attendanceStatus"
    )
    .innerText = "";

    showPage(markAttendancePage);

};


/* =====================================================
   PRINCIPAL RECORD
===================================================== */

window.openPrincipalRecord = function(){

    window.location.href =
        "Admin.html";

};


/* =====================================================
   LOAD FACE MODELS
===================================================== */

async function loadModels(){

    if(modelsLoaded){

        return;

    }

    await faceapi
    .nets
    .tinyFaceDetector
    .loadFromUri(
        "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
    );

    await faceapi
    .nets
    .faceLandmark68Net
    .loadFromUri(
        "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
    );

    await faceapi
    .nets
    .faceRecognitionNet
    .loadFromUri(
        "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
    );

    modelsLoaded = true;

}


/* =====================================================
   REGISTRATION CAMERA
   NO LOGIN CHECK
===================================================== */

window.startRegistrationCamera =
async function(){

    const status =
        document.getElementById(
            "registrationStatus"
        );

    try{

        status.innerText =
            "⏳ Camera start ho raha hai...";

        await loadModels();

        if(registrationStream){

            registrationStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        }

        registrationStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        const video =
            document.getElementById(
                "registrationVideo"
            );

        video.srcObject =
            registrationStream;

        await video.play();

        status.innerText =
            "✅ Camera ready hai. Face camera ke samne rakhein.";

    }
    catch(error){

        console.error(error);

        status.innerText =
            "❌ Camera error: "
            + error.message;

    }

};


/* =====================================================
   REGISTER FACE
   NO LOGIN CHECK
===================================================== */

window.registerFace =
async function(){

    const status =
        document.getElementById(
            "registrationStatus"
        );

    try{

        status.innerText =
            "🔍 Face detect ho raha hai...";

        await loadModels();

        const video =
            document.getElementById(
                "registrationVideo"
            );

        if(!video.srcObject){

            status.innerText =
                "❌ Pehle Start Camera dabayein.";

            return;

        }


        let detection = null;


        for(
            let i = 0;
            i < 15;
            i++
        ){

            detection =
                await faceapi
                .detectSingleFace(
                    video,
                    new faceapi
                    .TinyFaceDetectorOptions({

                        inputSize:320,

                        scoreThreshold:0.4

                    })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


            if(detection){

                break;

            }


            await new Promise(
                resolve =>
                setTimeout(resolve,400)
            );

        }


        if(!detection){

            status.innerText =
                "❌ Face detect nahi hua. Camera ke samne seedha dekhein.";

            return;

        }


        const descriptor =
            Array.from(
                detection.descriptor
            );


        const teacherName =
            getTeacherName();


        /* CHECK OLD FACE */

        const q =
            query(
                collection(
                    db,
                    "teacherFaces"
                ),
                where(
                    "name",
                    "==",
                    teacherName
                )
            );


        const snapshot =
            await getDocs(q);


        if(!snapshot.empty){

            status.innerText =
                "⚠️ "
                + teacherName
                + " ka face pehle se registered hai.";

            return;

        }


        /* SAVE FACE */

        await addDoc(
            collection(
                db,
                "teacherFaces"
            ),
            {

                name:
                    teacherName,

                descriptor:
                    descriptor,

                createdAt:
                    new Date()
                    .toISOString()

            }
        );


        status.innerText =
            "✅ "
            + teacherName
            + " ka face successfully register ho gaya.";

    }
    catch(error){

        console.error(error);

        status.innerText =
            "❌ Registration error: "
            + error.message;

    }

};


/* =====================================================
   ATTENDANCE CAMERA
   NO LOGIN CHECK
===================================================== */

window.startAttendanceCamera =
async function(){

    const status =
        document.getElementById(
            "attendanceStatus"
        );

    try{

        status.innerText =
            "⏳ Camera start ho raha hai...";

        await loadModels();


        if(attendanceStream){

            attendanceStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        }


        attendanceStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        const video =
            document.getElementById(
                "attendanceVideo"
            );


        video.srcObject =
            attendanceStream;

        await video.play();


        status.innerText =
            "✅ Camera ready hai. Face camera ke samne rakhein.";

    }
    catch(error){

        console.error(error);

        status.innerText =
            "❌ Camera error: "
            + error.message;

    }

};


/* =====================================================
   MARK ATTENDANCE
   NO LOGIN CHECK
===================================================== */

window.markAttendance =
async function(){

    const status =
        document.getElementById(
            "attendanceStatus"
        );

    try{

        status.innerText =
            "🔍 Face match ho raha hai...";


        await loadModels();


        const teacherName =
            getTeacherName();


        const video =
            document.getElementById(
                "attendanceVideo"
            );


        if(!video.srcObject){

            status.innerText =
                "❌ Pehle Start Camera dabayein.";

            return;

        }


        /* GET REGISTERED FACE */

        const faceQuery =
            query(
                collection(
                    db,
                    "teacherFaces"
                ),
                where(
                    "name",
                    "==",
                    teacherName
                )
            );


        const faceSnapshot =
            await getDocs(
                faceQuery
            );


        if(faceSnapshot.empty){

            status.innerText =
                "❌ "
                + teacherName
                + " ka face registered nahi hai.";

            return;

        }


        const faceData =
            faceSnapshot
            .docs[0]
            .data();


        const registeredDescriptor =
            new Float32Array(
                faceData.descriptor
            );


        /* DETECT CURRENT FACE */

        let detection = null;


        for(
            let i = 0;
            i < 15;
            i++
        ){

            detection =
                await faceapi
                .detectSingleFace(
                    video,
                    new faceapi
                    .TinyFaceDetectorOptions({

                        inputSize:320,

                        scoreThreshold:0.4

                    })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


            if(detection){

                break;

            }


            await new Promise(
                resolve =>
                setTimeout(resolve,400)
            );

        }


        if(!detection){

            status.innerText =
                "❌ Face detect nahi hua.";

            return;

        }


        /* MATCH */

        const distance =
            faceapi.euclideanDistance(
                registeredDescriptor,
                detection.descriptor
            );


        console.log(
            "Face distance:",
            distance
        );


        if(distance > 0.55){

            status.innerText =
                "❌ Face match nahi hua.";

            return;

        }


        /* DATE & TIME */

        const now =
            new Date();


        const date =
            String(
                now.getDate()
            ).padStart(2,"0")
            + "/"
            +
            String(
                now.getMonth()+1
            ).padStart(2,"0")
            + "/"
            +
            now.getFullYear();


        const time =
            String(
                now.getHours()
            ).padStart(2,"0")
            + ":"
            +
            String(
                now.getMinutes()
            ).padStart(2,"0")
            + ":"
            +
            String(
                now.getSeconds()
            ).padStart(2,"0");


        /* DUPLICATE CHECK */

        const attendanceQuery =
            query(
                collection(
                    db,
                    "attendance"
                ),

                where(
                    "name",
                    "==",
                    teacherName
                ),

                where(
                    "date",
                    "==",
                    date
                )
            );


        const attendanceSnapshot =
            await getDocs(
                attendanceQuery
            );


        if(
            !attendanceSnapshot.empty
        ){

            status.innerText =
                "⚠️ "
                + teacherName
                + " ki aaj ki attendance pehle se lagi hui hai.";

            return;

        }


        /* SAVE */

        await addDoc(
            collection(
                db,
                "attendance"
            ),
            {

                name:
                    teacherName,

                status:
                    "Present",

                date:
                    date,

                time:
                    time

            }
        );


        status.innerText =
            "✅ Attendance successfully save ho gayi.";

    }
    catch(error){

        console.error(error);

        status.innerText =
            "❌ Attendance error: "
            + error.message;

    }

};


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCameras(){

    if(registrationStream){

        registrationStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        registrationStream = null;

    }


    if(attendanceStream){

        attendanceStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        attendanceStream = null;

    }

}


/* =====================================================
   PAGE START
===================================================== */

window.addEventListener(
    "load",
    function(){

        const loggedIn =
            localStorage.getItem(
                "teacherLoggedIn"
            );

        const savedName =
            localStorage.getItem(
                "teacherName"
            );


        if(
            loggedIn === "true"
            &&
            savedName
        ){

            currentUser =
                savedName;

            document
            .getElementById(
                "welcomeText"
            )
            .innerText =
                "Welcome " + currentUser;

            showPage(menuPage);

        }
        else{

            showPage(loginPage);

        }

    }
);

</script>

</body>
</html>
