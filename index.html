import {

} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    addDoc,
    getDocs,
    doc,

    setDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:"AIzaSyBguAzVWGP_NUyObdv2Fsreu8pvPycSgzE",

    authDomain:"teachers-face-attendance.firebaseapp.com",

    projectId:"teachers-face-attendance",

    storageBucket:"teachers-face-attendance.firebasestorage.app",

    messagingSenderId:"63876838606",

    appId:"1:63876838606:web:572e240079865aabbc4c9f",

    measurementId:"G-XN93NKWLY5"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let currentUser=null;

let registrationStream=null;

let attendanceStream=null;

let faceapiLoaded=false;


/* LOGIN */

function showLogin(){

    document.getElementById("signupBox")
    .classList.add("hidden");

    document.getElementById("loginBox")
    .classList.remove("hidden");

    document.getElementById("status")

}


function showSignup(){

    document.getElementById("signupBox")
    .classList.remove("hidden");

    document.getElementById("loginBox")
    .classList.add("hidden");

    document.getElementById("status")
    .innerText="Create your teacher account.";

}


async function signup(){

    const name=document.getElementById("signupName").value.trim();

    const email=document.getElementById("signupEmail").value.trim();

    const password=document.getElementById("signupPassword").value;

    const confirm=document.getElementById("signupConfirm").value;


    if(!name){
        alert("Teacher name likhein.");
        return;
    }

    if(!email){
        alert("Email likhein.");
        return;
    }

    if(password.length<6){
        alert("Password kam az kam 6 characters ka hona chahiye.");
        return;
    }

    if(password!==confirm){
        alert("Password same nahi hain.");
        return;
    }


    try{

        document.getElementById("status").innerText=
        "⏳ Account ban raha hai...";


        const result=
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        await updateProfile(
            result.user,
            {displayName:name}
        );


        await setDoc(
            doc(db,"teacherAccounts",result.user.uid),
            {
                uid:result.user.uid,
                name:name,
                email:email,
                createdAt:new Date().toISOString()
            }
        );


        currentUser=result.user;

        openTeacherApp();

    }catch(error){

        console.error(error);

        alert(error.message);

    }

}

}

/* FACE REGISTRATION */

async function openFaceRegistration(){

    document.getElementById("dashboard")
    .classList.add("hidden");

    document.getElementById("faceRegistrationBox")
    .classList.remove("hidden");

    document.getElementById("status").innerText=
    "📷 Camera start ho rahi hai...";

    await startRegistrationCamera();

}


async function startRegistrationCamera(){

    try{

        if(registrationStream){
            registrationStream.getTracks()
            .forEach(track=>track.stop());
        }


        registrationStream=
        await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"},
            audio:false
        });


        const video=
        document.getElementById("registrationCamera");

        video.srcObject=registrationStream;

        await video.play();

        document.getElementById("status").innerText=
        "📷 Camera ready. Face camera ke samne rakhein.";

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText=
        "❌ Camera permission required.";

    }

}


async function registerFace(){

    if(!currentUser){
        alert("Pehle login karein.");
        return;
    }

    if(!faceapiLoaded){
        alert("Face system abhi load ho raha hai.");
        return;
    }


    const name=await getMyTeacherName();

    const video=
    document.getElementById("registrationCamera");


    try{

        document.getElementById("status").innerText=
        "👤 Face detect ho raha hai...";


        const detection=
        await faceapi
        .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize:320,
                scoreThreshold:0.4
            })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


        if(!detection){

            document.getElementById("status").innerText=
            "❌ Face detect nahi hua.";

            return;
        }


        const snapshot=
        await getDocs(collection(db,"teachers"));


        let already=false;


        snapshot.forEach(item=>{

            if(item.data().uid===currentUser.uid){
                already=true;
            }

        });


        if(already){

            alert("⚠️ Aapka face pehle se registered hai.");

            return;
        }


        await addDoc(
            collection(db,"teachers"),
            {
                uid:currentUser.uid,
                name:name,
                email:currentUser.email,
                descriptor:Array.from(detection.descriptor),
                registeredAt:new Date().toISOString()
            }
        );


        document.getElementById("status").innerText=
        "✅ Face successfully registered.";

        alert("✅ "+name+" ka face register ho gaya.");

    }catch(error){

        console.error(error);

        alert("Face registration error:\n\n"+error.message);

    }

}


/* ATTENDANCE */

async function openAttendance(){

async function startAttendanceCamera(){

    try{

        if(attendanceStream){
            attendanceStream.getTracks()
            .forEach(track=>track.stop());
        }


        attendanceStream=
        await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"},
            audio:false
        });


        const video=
        document.getElementById("attendanceCamera");

        video.srcObject=attendanceStream;

        await video.play();


        document.getElementById("status").innerText=
        "📷 Camera ready. Mark Attendance dabayein.";

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText=
        "❌ Camera permission required.";

}


async function checkFace(){

    if(!currentUser){
        alert("Pehle login karein.");
        return;
    }


    if(!faceapiLoaded){
        alert("Face system abhi load ho raha hai.");
        return;
    }


    const locationOK=
    await checkSchoolLocation();


    if(!locationOK) return;


    const video=
    document.getElementById("attendanceCamera");


    try{

        document.getElementById("status").innerText=
        "👤 Face match ho raha hai...";


        const detection=
        await faceapi
        .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize:320,
                scoreThreshold:0.4
            })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


        if(!detection){

            document.getElementById("status").innerText=
            "❌ Face detect nahi hua.";

            return;
        }


        const snapshot=
        await getDocs(collection(db,"teachers"));


        let bestMatch=null;

        let bestDistance=Infinity;


        snapshot.forEach(item=>{

            const teacher=item.data();

            if(teacher.uid!==currentUser.uid) return;

            if(!teacher.descriptor) return;


            const saved=
            new Float32Array(teacher.descriptor);


            const distance=
            faceapi.euclideanDistance(
                detection.descriptor,
                saved
            );


            if(distance<bestDistance){

                bestDistance=distance;

                bestMatch=teacher;

            }

        });


        if(!bestMatch || bestDistance>=0.55){

            document.getElementById("status").innerText=
            "❌ Face match nahi hua.";

            alert("Face match nahi hua.");

            return;
        }


        const today=
        new Date().toLocaleDateString();


        const now=
        new Date().toLocaleTimeString();


        const attendanceSnapshot=
        await getDocs(collection(db,"attendance"));


        let alreadyPresent=false;


        attendanceSnapshot.forEach(item=>{

            const record=item.data();


            if(
                record.uid===currentUser.uid &&
                record.date===today &&
                record.status==="Present"
            ){

                alreadyPresent=true;

            }

        });


        if(alreadyPresent){

            document.getElementById("status").innerText=
            "⚠️ Aaj attendance already lag chuki hai.";

            alert("⚠️ Aaj attendance already present hai.");

            return;
        }


        const attendance={

            uid:currentUser.uid,

            name:bestMatch.name,

            email:currentUser.email,

            status:"Present",

            date:today,

            time:now

        };


        await addDoc(
            collection(db,"attendance"),
            attendance
        );


        const history=
        JSON.parse(
            localStorage.getItem(
                "attendanceHistory_"+currentUser.uid
            )||"[]"
        );


        history.push(attendance);


        localStorage.setItem(
            "attendanceHistory_"+currentUser.uid,
            JSON.stringify(history)
        );


        document.getElementById("status").innerText=
        "✅ Attendance marked successfully.";


        alert(
            "✅ Attendance successful!\n\n"+
            bestMatch.name+"\n"+
            today+"\n"+
            now
        );


    }catch(error){

        console.error(error);

        document.getElementById("status").innerText=
        "❌ Attendance error";

        alert(error.message);

    }

}


/* LOCATION */

async function checkSchoolLocation(){

    try{

        const locationDoc=
        await getDoc(
            doc(db,"settings","schoolLocation")
        );


        if(!locationDoc.exists()){

            alert("School location abhi set nahi hai.");

            return false;
        }


        const school=locationDoc.data();


        return new Promise(resolve=>{

            navigator.geolocation.getCurrentPosition(

                position=>{

                    const distance=
                    calculateDistance(
                        school.latitude,
                        school.longitude,
                        position.coords.latitude,
                        position.coords.longitude
                    );


                    if(distance<=100){

                        document.getElementById("status").innerText=
                        "✅ School location verified.";

                        resolve(true);

                    }else{

                        alert(
                            "❌ Attendance nahi lagegi.\n\n"+
                            "Aap school ke 100 meter radius mein nahi hain."
                        );

                        resolve(false);

                    }

                },

                error=>{

                    console.error(error);

                    alert("Current GPS location nahi mili.");

                    resolve(false);

                },

                {
                    enableHighAccuracy:true,
                    timeout:20000,
                    maximumAge:0
                }

            );

        });

    }catch(error){

        console.error(error);

        return false;

    }

}


function calculateDistance(lat1,lon1,lat2,lon2){

    const R=6371000;

    const dLat=(lat2-lat1)*Math.PI/180;

    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
    Math.sin(dLat/2)**2+
    Math.cos(lat1*Math.PI/180)*
    Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;

    return R*
    2*
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

}


/* TEACHER NAME */

    const accountDoc=

            report
        );


        document.getElementById("status").innerText=
        "✅ Monthly Report Principal ko bhej di gayi.";


        alert(
            "✅ Monthly Report successfully submit ho gayi."
        );


        backToDashboard();


    }catch(error){

        console.error(error);

        document.getElementById("status").innerText=
        "❌ Monthly Report save nahi hui.";

        alert(error.message);

    }

}


/* HISTORY */

function showHistory(){

    if(!currentUser) return;


    document.getElementById("history").innerHTML="";

    const history=
    JSON.parse(
        localStorage.getItem(
            "attendanceHistory_"+currentUser.uid
        )||"[]"
    );


    if(history.length===0){

        document.getElementById("history").innerHTML=
        "<p>No attendance history.</p>";

        return;
    }


    let html="<h3>📋 My Attendance History</h3>";


    history.slice().reverse().forEach(record=>{

        html+=
        "<p>"+
        "👤 "+record.name+
        "<br>📅 "+record.date+
        "<br>⏰ "+record.time+
        "<br>✅ "+record.status+
        "</p>";

    });


    document.getElementById("history").innerHTML=html;

}


/* CAMERA STOP */

function stopCameras(){

    if(registrationStream){

        registrationStream.getTracks()
        .forEach(track=>track.stop());

        registrationStream=null;
    }


    if(attendanceStream){

        attendanceStream.getTracks()
        .forEach(track=>track.stop());

        attendanceStream=null;
    }

}


/* LOGOUT */

async function logout(){

    stopCameras();

    await signOut(auth);

    currentUser=null;

    document.getElementById("appSection")
    .classList.add("hidden");

    document.getElementById("authSection")
    .classList.remove("hidden");

    showLogin();

}


/* AUTH STATE */

onAuthStateChanged(auth,user=>{

    if(user){

        currentUser=user;

        openTeacherApp();

    }else{

        currentUser=null;

        document.getElementById("appSection")
        .classList.add("hidden");

        document.getElementById("authSection")
        .classList.remove("hidden");

        showLogin();

    }

});


/* FACE API */

function loadFaceApi(){

    return new Promise((resolve,reject)=>{

        const script=document.createElement("script");

        script.src=
        "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js";


        script.onload=async()=>{

            try{

                const modelURL=
                "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";


                await faceapi.nets.tinyFaceDetector
                .loadFromUri(modelURL);

                await faceapi.nets.faceLandmark68Net
                .loadFromUri(modelURL);

                await faceapi.nets.faceRecognitionNet
                .loadFromUri(modelURL);


                faceapiLoaded=true;

                resolve();

            }catch(error){

                console.error(error);

                reject(error);

            }

        };


        script.onerror=reject;

        document.head.appendChild(script);

    });

}
