<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 15px;
    }

    video {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }

    input {
      padding: 12px;
      width: 80%;
      max-width: 350px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Face Attendance</h1>

<input id="name" type="text" placeholder="Student / Teacher Name">

<br>

<button onclick="startCamera()">Start Camera</button>
<button onclick="registerFace()">Register Face</button>
<button onclick="checkFace()">Mark Attendance</button>

<video id="camera" autoplay muted playsinline></video>

<h3 id="status">Loading...</h3>

<script>

let stream = null;
let registeredName = "";
let registeredDescriptor = null;

const MODEL_URL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

async function loadModels() {

  try {

    document.getElementById("status").innerText =
      "Loading face recognition...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

    // Purani registration load karo
    const saved = localStorage.getItem("registeredFace");

    if (saved) {
      const data = JSON.parse(saved);

      registeredName = data.name;
      registeredDescriptor = new Float32Array(data.descriptor);

      document.getElementById("name").value = registeredName;

      document.getElementById("status").innerText =
        registeredName + " ka face already registered ✅";
    } else {
      document.getElementById("status").innerText =
        "Models loaded ✅ Start Camera";
    }

  } catch (error) {

    console.log(error);

    document.getElementById("status").innerText =
      "Model loading error";

  }
}

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    const video = document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    document.getElementById("status").innerText =
      "Camera started successfully ✅";

  } catch (error) {

    document.getElementById("status").innerText =
      "Camera error: " + error.name;

  }
}

async function registerFace() {

  const name = document.getElementById("name").value.trim();
  const video = document.getElementById("camera");

  if (!name) {
    alert("Pehle naam likhein.");
    return;
  }

  if (!stream) {
    alert("Pehle Start Camera dabayein.");
    return;
  }

  document.getElementById("status").innerText =
    "Face scan ho raha hai...";

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 416,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {

    document.getElementById("status").innerText =
      "Face detect nahi hua.";

    return;
  }

  // Face descriptor ko permanently save karo
  registeredName = name;

  registeredDescriptor =
    Array.from(detection.descriptor);

  localStorage.setItem(
    "registeredFace",
    JSON.stringify({
      name: registeredName,
      descriptor: registeredDescriptor
    })
  );

  // Array ko wapas Float32Array banao
  registeredDescriptor =
    new Float32Array(registeredDescriptor);

  document.getElementById("status").innerText =
    registeredName + " ka face register ho gaya ✅";

}

async function checkFace() {

  if (!registeredDescriptor) {

    alert(
      "Pehle face Register karein."
    );

    return;
  }

  const video = document.getElementById("camera");

  document.getElementById("status").innerText =
    "Face match ho raha hai...";

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 416,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {

    document.getElementById("status").innerText =
      "Face detect nahi hua.";

    return;
  }

  const distance =
    faceapi.euclideanDistance(
      registeredDescriptor,
      detection.descriptor
    );

  if (distance < 0.55) {

    const now = new Date();

    const date =
      now.toLocaleDateString();

    const time =
      now.toLocaleTimeString();

    const attendance = {
      name: registeredName,
      status: "Present",
      date: date,
      time: time
    };

    localStorage.setItem(
      "attendance",
      JSON.stringify(attendance)
    );

    document.getElementById("status").innerText =
      "✅ " +
      registeredName +
      " Present\n" +
      date +
      " " +
      time;

  } else {

    document.getElementById("status").innerText =
      "❌ Face match nahi hua.";

  }
}

loadModels();

</script>

</body>
</html>
