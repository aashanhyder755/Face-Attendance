<!DOCTYPE html><html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers Face Attendance</title>  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      width: 80%;
      max-width: 350px;
      font-size: 16px;
      margin: 5px;
    }

    button {
      padding: 12px 20px;
      margin: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
      margin-top: 10px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      white-space: pre-line;
    }

    #history {
      margin: 20px auto;
      max-width: 500px;
      text-align: left;
    }

    .record {
      border: 1px solid #ccc;
      background: white;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
    }
  </style></head><body><h1>Teachers Face Attendance</h1><input id="name" type="text" placeholder="Teacher Name"><br><button onclick="startCamera()">📷 Start Camera</button>
<button onclick="registerFace()">➕ Register Teacher Face</button>

<br><button onclick="checkFace()">✅ Mark Attendance</button>

<br><button onclick="showHistory()">📋 Attendance History</button>
<button onclick="clearHistory()">🗑️ Clear Local History</button>

<br><video id="camera" autoplay muted playsinline></video>

<h3 id="status">Loading face recognition...</h3><div id="history"></div><script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",
  authDomain: "teachers-face-attendance.firebaseapp.com",
  projectId: "teachers-face-attendance",
  storageBucket: "teachers-face-attendance.firebasestorage.app",
  messagingSenderId: "63876838606",
  appId: "1:63876838606:web:572e240079865aabbc4c9f",
  measurementId: "G-XN93NKWLY5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* Variables */

let stream = null;

const MODEL_URL =
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";


/* Load Models */

async function loadModels() {

  try {

    document.getElementById("status").innerText =
      "Face recognition loading...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);

    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

    document.getElementById("status").innerText =
      "✅ Models loaded. Camera start karein.";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Model error: " + error.message;

  }

}


/* Start Camera */

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },

      audio: false

    });

    const video = document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    document.getElementById("status").innerText =
      "📷 Camera started successfully ✅";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Camera error: " + error.message;

  }

}


/* Register Teacher Face */

async function registerFace() {

  const name =
    document.getElementById("name").value.trim();

  const video =
    document.getElementById("camera");

  if (!name) {

    alert("Pehle teacher ka naam likhein.");

    return;

  }

  if (!stream) {

    alert("Pehle Start Camera dabayein.");

    return;

  }

  document.getElementById("status").innerText =
    "🔍 Face scan ho raha hai...";

  try {

    const detection =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.4
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

    if (!detection) {

      document.getElementById("status").innerText =
        "❌ Face detect nahi hua.";

      return;

    }

    const descriptor =
      Array.from(detection.descriptor);

    const snapshot =
      await getDocs(
        collection(db, "teachers")
      );

    let sameName = false;

    snapshot.forEach((doc) => {

      const data = doc.data();

      if (
        data.name &&
        data.name.toLowerCase() === name.toLowerCase()
      ) {

        sameName = true;

      }

    });

    if (sameName) {

      const confirmUpdate =
        confirm(
          name +
          " pehle se registered hai.\n\n" +
          "Kya face dobara register karna hai?"
        );

      if (!confirmUpdate) {

        document.getElementById("status").innerText =
          "Registration cancel.";

        return;

      }

    }

    await addDoc(
      collection(db, "teachers"),
      {
        name: name,
        descriptor: descriptor
      }
    );

    document.getElementById("status").innerText =
      "✅ " +
      name +
      " ka face Firebase mein register ho gaya.";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Registration error: " +
      error.message;

  }

}


/* Mark Attendance */

async function checkFace() {

  if (!stream) {

    alert("Pehle Start Camera dabayein.");

    return;

  }

  const video =
    document.getElementById("camera");

  const status =
    document.getElementById("status");

  status.innerText =
    "🔍 Face detect ho raha hai...";

  try {

    const detection =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.4
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

    if (!detection) {

      status.innerText =
        "❌ Face detect nahi hua.";

      return;

    }

    status.innerText =
      "🔄 Teacher match ho raha hai...";

    const snapshot =
      await getDocs(
        collection(db, "teachers")
      );

    if (snapshot.empty) {

      status.innerText =
        "❌ Koi teacher registered nahi hai.";

      return;

    }

    let matchedTeacher = null;
    let smallestDistance = 999;

    snapshot.forEach((doc) => {

      const data = doc.data();

      if (
        data.descriptor &&
        data.descriptor.length
      ) {

        const savedDescriptor =
          new Float32Array(data.descriptor);

        const distance =
          faceapi.euclideanDistance(
            savedDescriptor,
            detection.descriptor
          );

        if (distance < smallestDistance) {

          smallestDistance = distance;
          matchedTeacher = data.name;

        }

      }

    });

    if (
      !matchedTeacher ||
      smallestDistance >= 0.55
    ) {

      status.innerText =
        "❌ Face match nahi hua.";

      return;

    }

    const now = new Date();

    const date =
      now.toLocaleDateString();

    const time =
      now.toLocaleTimeString();

    const attendanceSnapshot =
      await getDocs(
        collection(db, "attendance")
      );

    let alreadyMarked = false;

    attendanceSnapshot.forEach((doc) => {

      const data = doc.data();

      if (
        data.name === matchedTeacher &&
        data.date === date &&
        data.status === "Present"
      ) {

        alreadyMarked = true;

      }

    });

    if (alreadyMarked) {

      status.innerText =
        "⚠️ " +
        matchedTeacher +
        " ki aaj ki attendance pehle hi lag chuki hai.";

      return;

    }

    const attendance = {

      name: matchedTeacher,

      status: "Present",

      date: date,

      time: time

    };

    /* Firebase mein attendance save */

    await addDoc(
      collection(db, "attendance"),
      attendance
    );

    /* Local history */

    let history =
      JSON.parse(
        localStorage.getItem("attendanceHistory")
      ) || [];

    history.push(attendance);

    localStorage.setItem(
      "attendanceHistory",
      JSON.stringify(history)
    );

    status.innerText =
      "✅ " +
      matchedTeacher +
      " Present\n" +
      date +
      " " +
      time +
      "\n☁️ Firebase mein save ho gaya";

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error: " +
      error.message;

  }

}


/* Attendance History */

function showHistory() {

  const history =
    JSON.parse(
      localStorage.getItem("attendanceHistory")
    ) || [];

  const box =
    document.getElementById("history");

  if (history.length === 0) {

    box.innerHTML =
      "<h3>Attendance History</h3>" +
      "<p>No record found.</p>";

    return;

  }

  let html =
    "<h3>Attendance History</h3>";

  history
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=
        '<div class="record">' +

        "<b>Name:</b> " +
        record.name +

        "<br>" +

        "<b>Status:</b> " +
        record.status +

        "<br>" +

        "<b>Date:</b> " +
        record.date +

        "<br>" +

        "<b>Time:</b> " +
        record.time +

        "</div>";

    });

  box.innerHTML = html;

}


/* Clear Local History */

function clearHistory() {

  if (
    confirm(
      "Kya aap local Attendance History delete karna chahte hain?"
    )
  ) {

    localStorage.removeItem(
      "attendanceHistory"
    );

    document.getElementById(
      "history"
    ).innerHTML = "";

    document.getElementById(
      "status"
    ).innerText =
      "Local history clear ho gayi.";

  }

}


/* Buttons */

window.startCamera = startCamera;
window.registerFace = registerFace;
window.checkFace = checkFace;
window.showHistory = showHistory;
window.clearHistory = clearHistory;


/* Start */

loadModels();

</script></body>
</html>
