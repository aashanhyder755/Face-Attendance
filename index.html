/* =====================================================
   FACE API MODELS
===================================================== */

async function loadFaceModels(){

    if(modelsLoaded){

        return true;

    }


    try{

        const MODEL_URL =
            "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";


        await faceapi.nets.tinyFaceDetector
            .loadFromUri(MODEL_URL);


        await faceapi.nets.faceLandmark68Net
            .loadFromUri(MODEL_URL);


        await faceapi.nets.faceRecognitionNet
            .loadFromUri(MODEL_URL);


        modelsLoaded = true;


        return true;


    }catch(error){

        console.error(error);


        alert(
            "Face system load nahi ho saka. Internet connection check karein."
        );


        return false;

    }

}


/* =====================================================
   REGISTRATION CAMERA
===================================================== */

async function startCamera(){

    try{

        stopCamera();


        const video =
            document.getElementById("video");


        videoStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false

            });


        video.srcObject =
            videoStream;


        await video.play();


        document.getElementById("faceStatus")
            .innerText =
            "Camera ready. Face camera ke samne rakhein.";


    }catch(error){

        console.error(error);


        document.getElementById("faceStatus")
            .innerText =
            "❌ Camera permission required.";


        alert(
            "Camera permission allow karein aur dobara Start Camera dabayein."
        );

    }

}

/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    if(videoStream){

        videoStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        videoStream = null;

    }


    const video1 =
        document.getElementById("video");


    if(video1){

        video1.srcObject = null;

    }


    const video2 =
        document.getElementById(
            "videoAttendance"
        );


    if(video2){

        video2.srcObject = null;

    }

}


/* =====================================================
   GET CURRENT VIDEO
===================================================== */

function getCurrentVideo(){

    const attendancePage =
        document.getElementById(
            "attendancePage"
        );


    if(
        attendancePage &&
        !attendancePage.classList.contains("hidden")
    ){

        return document.getElementById(
            "videoAttendance"
        );

    }


    return document.getElementById(
        "video"
    );

}


/* =====================================================
   FACE DETECTION
===================================================== */

async function getFaceDescriptor(){

    if(!videoStream){

        alert(
            "Pehle Start Camera dabayein."
        );

        return null;

    }


    const ready =
        await loadFaceModels();


    if(!ready){

        return null;

    }


    const video =
        getCurrentVideo();


    if(!video){

        return null;

    }


    if(
        video.readyState <
        2
    ){

        alert(
            "Camera abhi ready nahi hai. Thora wait karke dobara try karein."
        );

        return null;

    }


    const isAttendance =
        !document.getElementById(
            "attendancePage"
        ).classList.contains("hidden");


    if(isAttendance){

        document.getElementById(
            "attendanceStatus"
        ).innerText =
            "Face detection start...";

    }else{

        document.getElementById(
            "faceStatus"
        ).innerText =
            "Face detection start...";

    }


    try{

        const detection =
            await faceapi
            .detectSingleFace(
                video,
                new faceapi.TinyFaceDetectorOptions({

                    inputSize:320,

                    scoreThreshold:0.5

                })
            )
            .withFaceLandmarks()
            .withFaceDescriptor();


        if(!detection){

            if(isAttendance){

                document.getElementById(
                    "attendanceStatus"
                ).innerText =
                    "❌ Face detect nahi hua. Camera ke samne seedha dekhein.";

            }else{

                document.getElementById(
                    "faceStatus"
                ).innerText =
                    "❌ Face detect nahi hua. Camera ke samne seedha dekhein.";

            }


            return null;

        }


        if(isAttendance){

            document.getElementById(
                "attendanceStatus"
            ).innerText =
                "✅ Face detected.";

        }else{

            document.getElementById(
                "faceStatus"
            ).innerText =
                "✅ Face detected.";

        }


        return Array.from(
            detection.descriptor
        );


    }catch(error){

        console.error(error);


        if(isAttendance){

            document.getElementById(
                "attendanceStatus"
            ).innerText =
                "❌ Face detection error.";

        }else{

            document.getElementById(
                "faceStatus"
            ).innerText =
                "❌ Face detection error.";

        }


        return null;

    }

}


/* =====================================================
   REGISTER FACE
===================================================== */

async function registerFace(){

    if(!teacherName){

        alert(
            "Teacher name missing hai."
        );

        return;

    }


    const descriptor =
        await getFaceDescriptor();


    if(!descriptor){

        return;

    }


    try{

        document.getElementById(
            "faceStatus"
        ).innerText =
            "Face Firebase mein save ho raha hai...";


        const q =
            query(
                collection(
                    db,
                    "teacherFaces"
                ),

                where(
                    "name",
                    "==",
                    teacherName
                )
            );


        const snapshot =
            await getDocs(q);


        if(!snapshot.empty){

            document.getElementById(
                "faceStatus"
            ).innerText =
                "⚠️ Is teacher ka face pehle se registered hai.";


            alert(
                "Teacher " +
                teacherName +
                " ka face already registered hai."
            );


            return;

        }


        await addDoc(
            collection(
                db,
                "teacherFaces"
            ),
            {
                name:teacherName,

                descriptor:descriptor,

                createdAt:
                    serverTimestamp()
            }
        );


        document.getElementById(
            "faceStatus"
        ).innerText =
            "✅ Face Firebase mein successfully registered ho gaya.";


        alert(
            "Face registration successful!"
        );


    }catch(error){

        console.error(error);


        document.getElementById(
            "faceStatus"
        ).innerText =
            "❌ Firebase error.";


        alert(
            "Face save nahi ho saka. Firebase configuration check karein."
        );

    }

}


/* =====================================================
   GET REGISTERED FACE
===================================================== */

async function getRegisteredFace(){

    const q =
        query(
            collection(
                db,
                "teacherFaces"
            ),

            where(
                "name",
                "==",
                teacherName
            )
        );


    const snapshot =
        await getDocs(q);


    if(snapshot.empty){

        return null;

    }


    return snapshot.docs[0]
        .data()
        .descriptor;

}


/* =====================================================
   FACE MATCH
===================================================== */

function faceMatch(
    descriptor1,
    descriptor2
){

    const distance =
        faceapi.euclideanDistance(
            descriptor1,
            descriptor2
        );


    console.log(
        "Face distance:",
        distance
    );


    return distance < 0.55;

}


/* =====================================================
   SCHOOL LOCATION
===================================================== */

const LOCATION_CHECK = false;

const SCHOOL_LATITUDE = 0;

const SCHOOL_LONGITUDE = 0;

const SCHOOL_RADIUS_METERS = 200;


function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;


    const p1 =
        lat1 *
        Math.PI /
        180;


    const p2 =
        lat2 *
        Math.PI /
        180;


    const dLat =
        (lat2-lat1) *
        Math.PI /
        180;


    const dLon =
        (lon2-lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


function checkSchoolLocation(){

    return new Promise(
        resolve => {

            if(!LOCATION_CHECK){

                resolve(true);

                return;

            }


            if(!navigator.geolocation){

                alert(
                    "Location service available nahi hai."
                );

                resolve(false);

                return;

            }


            navigator.geolocation.getCurrentPosition(

                position => {

                    const distance =
                        getDistance(
                            position.coords.latitude,
                            position.coords.longitude,
                            SCHOOL_LATITUDE,
                            SCHOOL_LONGITUDE
                        );


                    if(
                        distance <=
                        SCHOOL_RADIUS_METERS
                    ){

                        resolve(true);

                    }else{

                        alert(
                            "Aap school location ke bahar hain."
                        );

                        resolve(false);

                    }

                },

                error => {

                    alert(
                        "Location permission allow karein."
                    );

                    resolve(false);

                },

                {
                    enableHighAccuracy:true,
                    timeout:10000,
                    maximumAge:0
                }

            );

        }
    );

}


/* =====================================================
   CHECK TODAY DUPLICATE
===================================================== */

async function alreadyMarkedToday(){

    const today =
        new Date()
        .toLocaleDateString(
            "en-GB"
        );


    const q =
        query(
            collection(
                db,
                "attendance"
            ),

            where(
                "name",
                "==",
                teacherName
            ),

            where(
                "date",
                "==",
                today
            )
        );


    const snapshot =
        await getDocs(q);


    return !snapshot.empty;

}


/* =====================================================
   MARK ATTENDANCE
===================================================== */

async function markAttendance(){

    if(!teacherName){

        alert(
            "Teacher name missing hai."
        );

        return;

    }


    const status =
        document.getElementById(
            "attendanceStatus"
        );


    try{

        status.innerText =
            "Checking today's attendance...";


        const duplicate =
            await alreadyMarkedToday();


        if(duplicate){

            status.innerText =
                "⚠️ Aaj ki attendance already marked hai.";


            alert(
                "Aaj aapki attendance pehle se marked hai."
            );


            return;

        }


        const locationOK =
            await checkSchoolLocation();


        if(!locationOK){

            status.innerText =
                "❌ School location verify nahi hui.";

            return;

        }


        status.innerText =
            "Registered face check ho raha hai...";


        const registered =
            await getRegisteredFace();


        if(!registered){

            status.innerText =
                "❌ Pehle Face Registration karein.";


            alert(
                "Is teacher ka face registered nahi hai."
            );


            return;

        }


        const currentDescriptor =
            await getFaceDescriptor();


        if(!currentDescriptor){

            return;

        }


        status.innerText =
            "Face match ho raha hai...";


        const matched =
            faceMatch(
                currentDescriptor,
                registered
            );


        if(!matched){

            status.innerText =
                "❌ Face match nahi hua.";


            alert(
                "Face registered face se match nahi hua."
            );


            return;

        }


        const now =
            new Date();


        const date =
            now.toLocaleDateString(
                "en-GB"
            );


        const time =
            now.toLocaleTimeString(
                "en-GB"
            );


        await addDoc(
            collection(
                db,
                "attendance"
            ),
            {
                name:teacherName,

                status:"Present",

                date:date,

                time:time,

                createdAt:
                    serverTimestamp()
            }
        );


        status.innerText =
            "☁️ Firebase mein attendance save ho gayi.";


        alert(
            "✅ Attendance successfully marked!"
        );


        stopCamera();


    }catch(error){

        console.error(error);


        status.innerText =
            "❌ Attendance error.";


        alert(
            "Attendance save nahi ho saki."
        );

    }

}

                ).value,

            read:
                document.getElementById(
                    "sindhiRead"
                ).value,

            write:
                document.getElementById(
                    "sindhiWrite"
                ).value,

            checked:
                document.getElementById(
                    "sindhiChecked"
                ).value,

            unchecked:
                document.getElementById(
                    "sindhiUnchecked"
                ).value

        },


        SS:{

            total:
                document.getElementById(
                    "ssTotal"
                ).value,

            read:
                document.getElementById(
                    "ssRead"
                ).value,

            write:
                document.getElementById(
                    "ssWrite"
                ).value,

            checked:
                document.getElementById(
                    "ssChecked"
                ).value,

            unchecked:
                document.getElementById(
                    "ssUnchecked"
                ).value

        },


        createdAt:
            serverTimestamp()

    };


    try{

        await addDoc(
            collection(
                db,
                "monthlyReports"
            ),
            reportData
        );


        alert(
            "✅ Monthly Report successfully submitted."
        );


        await loadMonthlyReport();


    }catch(error){

        console.error(error);


        alert(
            "❌ Monthly Report submit nahi ho saki."
        );

    }

}

</script>

</head>
