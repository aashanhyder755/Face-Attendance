<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers Face Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e8f1ff,#f7fbff);
    min-height:100vh;
    color:#222;
}

.container{
    width:94%;
    max-width:500px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    margin-bottom:20px;
}

h1,h2,h3{
    text-align:center;
}

.school{
    text-align:center;
    font-weight:bold;
    color:#1565c0;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.loginBtn{
    background:#1565c0;
    color:white;
}

.faceBtn{
    background:#1976d2;
    color:white;
}

.attBtn{
    background:#2e7d32;
    color:white;
}

.adminBtn{
    background:#1565c0;
    color:white;
}

.backBtn{
    background:#555;
    color:white;
}

.logoutBtn{
    background:#c62828;
    color:white;
}

video{
    width:100%;
    border-radius:15px;
    background:#111;
    margin:10px 0;
}

.status{
    text-align:center;
    font-weight:bold;
    margin:12px 0;
    min-height:24px;
}

.hidden{
    display:none !important;
}

.welcome{
    text-align:center;
    font-size:18px;
    margin-bottom:20px;
}

.small{
    text-align:center;
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginPage" class="card">

    <h1>👨‍🏫 Teacher Login</h1>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <label>Teacher Email:</label>

    <input
        type="email"
        id="loginEmail"
        placeholder="Teacher Email"
    >

    <label>Password:</label>

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <button
        class="loginBtn"
        onclick="loginTeacher()"
    >
        🔐 Login
    </button>

    <div
        id="loginStatus"
        class="status"
    ></div>

</div>


<!-- =====================================================
     TEACHER MENU
===================================================== -->

<div id="menuPage" class="card hidden">

    <h1>👨‍🏫 Teacher Menu</h1>

    <div class="school">
        Moon Star Public High School Khanwahan
    </div>

    <div
        id="welcomeText"
        class="welcome"
    ></div>


    <button
        class="faceBtn"
        onclick="openPage('faceRegistration')"
    >
        📷 Face Registration
    </button>


    <button
        class="attBtn"
        onclick="openPage('markAttendance')"
    >
        ✅ Mark Attendance
    </button>


    <button
        class="adminBtn"
        onclick="openPrincipalRecord()"
    >
        📊 Principal Record
    </button>


    <button
        class="logoutBtn"
        onclick="logoutTeacher()"
    >
        🚪 Logout
    </button>

</div>


<!-- =====================================================
     FACE REGISTRATION
===================================================== -->

<div
    id="faceRegistration"
    class="card hidden"
>

    <h2>👤 Face Registration</h2>

    <div class="school">
        Register Teacher Face
    </div>

    <p class="small">
        Apna face camera ke samne rakhein.
    </p>


    <video
        id="video"
        autoplay
        muted
        playsinline
    ></video>


    <button
        class="faceBtn"
        onclick="startRegistrationCamera()"
    >
        📷 Start Camera
    </button>


    <button
        class="faceBtn"
        onclick="registerFace()"
    >
        👤 Register My Face
    </button>


    <div
        id="registrationStatus"
        class="status"
    ></div>


    <button
        class="backBtn"
        onclick="openPage('menu')"
    >
        ← Back
    </button>

</div>


<!-- =====================================================
     MARK ATTENDANCE
===================================================== -->

<div
    id="markAttendance"
    class="card hidden"
>

    <h2>✅ Mark Attendance</h2>

    <div class="school">
        Teacher Attendance
    </div>

    <p class="small">
        Apna registered face camera ke samne rakhein.
    </p>


    <video
        id="videoAttendance"
        autoplay
        muted
        playsinline
    ></video>


    <button
        class="attBtn"
        onclick="startAttendanceCamera()"
    >
        📷 Start Camera
    </button>


    <button
        class="attBtn"
        onclick="markAttendance()"
    >
        ✅ Mark Attendance
    </button>


    <div
        id="attendanceStatus"
        class="status"
    ></div>


    <button
        class="backBtn"
        onclick="openPage('menu')"
    >
        ← Back
    </button>

</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
=========================================================
APNI WORKING FIREBASE CONFIG YAHAN RAKHEIN
=========================================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "teachers-face-attendance.firebaseapp.com",

    projectId:
        "teachers-face-attendance",

    storageBucket:
        "teachers-face-attendance.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =====================================================
   LOGIN
===================================================== */

const LOGIN_EMAIL =
    "ashfaque.thebo@gmail.com";


const LOGIN_PASSWORD =
    "123456789";


let currentUser =
    localStorage.getItem("teacherName") || "";


/* =====================================================
   PAGE CONTROL
===================================================== */

window.openPage = function(page){

    /*
       IMPORTANT:
       Yahan Face Registration aur Mark Attendance
       ke liye login check NAHI hai.

       Login ke baad currentUser save hota hai.
    */


    if(
        page === "faceRegistration" &&
        !currentUser
    ){

        showOnly("loginPage");

        return;

    }


    if(
        page === "markAttendance" &&
        !currentUser
    ){

        showOnly("loginPage");

        return;

    }


    if(
        page === "menu" &&
        !currentUser
    ){

        showOnly("loginPage");

        return;

    }


    showOnly(
        page === "menu"
        ? "menuPage"
        : page
    );


    if(page === "faceRegistration"){

        stopAllCameras();

        document.getElementById(
            "registrationStatus"
        ).innerText = "";

    }


    if(page === "markAttendance"){

        stopAllCameras();

        document.getElementById(
            "attendanceStatus"
        ).innerText = "";

    }

};


/* =====================================================
   SHOW PAGE
===================================================== */

function showOnly(id){

    const pages = [

        "loginPage",
        "menuPage",
        "faceRegistration",
        "markAttendance"

    ];


    pages.forEach(function(page){

        const element =
            document.getElementById(page);


        if(element){

            element.classList.add("hidden");

        }

    });


    const target =
        document.getElementById(id);


    if(target){

        target.classList.remove("hidden");

    }

}


/* =====================================================
   LOGIN
===================================================== */

window.loginTeacher = function(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const status =
        document.getElementById(
            "loginStatus"
        );


    if(
        email === LOGIN_EMAIL &&
        password === LOGIN_PASSWORD
    ){

        currentUser =
            "Ashfaque";


        localStorage.setItem(
            "teacherLoggedIn",
            "true"
        );


        localStorage.setItem(
            "teacherName",
            currentUser
        );


        status.innerText =
            "✅ Login successful";


        document.getElementById(
            "welcomeText"
        ).innerText =
            "Welcome " + currentUser;


        setTimeout(function(){

            showOnly("menuPage");

        },500);


    }else{

        status.innerText =
            "❌ Email ya password ghalat hai.";

    }

};


/* =====================================================
   LOGOUT
===================================================== */

window.logoutTeacher = function(){

    stopAllCameras();


    localStorage.removeItem(
        "teacherLoggedIn"
    );


    localStorage.removeItem(
        "teacherName"
    );


    currentUser = "";


    document.getElementById(
        "loginEmail"
    ).value = "";


    document.getElementById(
        "loginPassword"
    ).value = "";


    document.getElementById(
        "loginStatus"
    ).innerText = "";


    showOnly("loginPage");

};


/* =====================================================
   PRINCIPAL RECORD
===================================================== */

window.openPrincipalRecord = function(){

    if(!currentUser){

        showOnly("loginPage");

        return;

    }


    /*
       Principal Record alag Admin.html mein hai.

       Monthly Report bhi Principal Record ke andar
       Admin.html mein rakhi jayegi.
    */

    window.location.href =
        "Admin.html";

};


/* =====================================================
   CAMERA VARIABLES
===================================================== */

let registrationStream = null;

let attendanceStream = null;


/* =====================================================
   FACE API
===================================================== */

let modelsLoaded = false;


async function loadFaceModels(){

    if(modelsLoaded){

        return true;

    }


    try{

        const MODEL_URL =
            "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";


        await Promise.all([

            faceapi.nets.tinyFaceDetector.loadFromUri(
                MODEL_URL
            ),

            faceapi.nets.faceLandmark68Net.loadFromUri(
                MODEL_URL
            ),

            faceapi.nets.faceRecognitionNet.loadFromUri(
                MODEL_URL
            )

        ]);


        modelsLoaded = true;


        return true;


    }catch(error){

        console.error(
            "Model Error:",
            error
        );


        return false;

    }

}


/* =====================================================
   REGISTRATION CAMERA
===================================================== */

window.startRegistrationCamera =
async function(){

    const status =
        document.getElementById(
            "registrationStatus"
        );


    try{

        stopAttendanceCamera();


        const video =
            document.getElementById(
                "video"
            );


        registrationStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        video.srcObject =
            registrationStream;


        status.innerText =
            "📷 Camera started";


        const loaded =
            await loadFaceModels();


        if(!loaded){

            status.innerText =
                "❌ Face models load nahi hue.";

            return;

        }


        status.innerText =
            "📷 Camera ready. Face camera ke samne rakhein.";


    }catch(error){

        console.error(error);


        status.innerText =
            "❌ Camera permission required.";

    }

};


/* =====================================================
   ATTENDANCE CAMERA
===================================================== */

window.startAttendanceCamera =
async function(){

    const status =
        document.getElementById(
            "attendanceStatus"
        );


    try{

        stopRegistrationCamera();


        const video =
            document.getElementById(
                "videoAttendance"
            );


        attendanceStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        video.srcObject =
            attendanceStream;


        status.innerText =
            "📷 Camera started";


        const loaded =
            await loadFaceModels();


        if(!loaded){

            status.innerText =
                "❌ Face models load nahi hue.";

            return;

        }


        status.innerText =
            "📷 Camera ready. Face camera ke samne rakhein.";


    }catch(error){

        console.error(error);


        status.innerText =
            "❌ Camera permission required.";

    }

};


/* =====================================================
   STOP CAMERAS
===================================================== */

function stopRegistrationCamera(){

    if(registrationStream){

        registrationStream
            .getTracks()
            .forEach(function(track){

                track.stop();

            });


        registrationStream = null;

    }

}


function stopAttendanceCamera(){

    if(attendanceStream){

        attendanceStream
            .getTracks()
            .forEach(function(track){

                track.stop();

            });


        attendanceStream = null;

    }

}


function stopAllCameras(){

    stopRegistrationCamera();

    stopAttendanceCamera();

}


/* =====================================================
   GET VIDEO
===================================================== */

function getVideo(id){

    return document.getElementById(id);

}


/* =====================================================
   FACE DESCRIPTOR
===================================================== */

async function getFaceDescriptor(video){

    if(!video){

        return null;

    }


    if(video.readyState < 2){

        return null;

    }


    const detection =
        await faceapi
        .detectSingleFace(

            video,

            new faceapi.TinyFaceDetectorOptions({

                inputSize:320,

                scoreThreshold:0.5

            })

        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if(!detection){

        return null;

    }


    return Array.from(
        detection.descriptor
    );

}


/* =====================================================
   REGISTER FACE
===================================================== */

window.registerFace =
async function(){

    const status =
        document.getElementById(
            "registrationStatus"
        );


    /*
       Login page par dobara nahi bhejna.
       Current user sirf login ke baad set hota hai.
    */

    if(!currentUser){

        status.innerText =
            "❌ Pehle Teacher Login karein.";

        return;

    }


    status.innerText =
        "⏳ Face detect ho raha hai...";


    try{

        const loaded =
            await loadFaceModels();


        if(!loaded){

            status.innerText =
                "❌ Face models load nahi hue.";

            return;

        }


        const video =
            getVideo("video");


        const descriptor =
            await getFaceDescriptor(
                video
            );


        if(!descriptor){

            status.innerText =
                "❌ Face detect nahi hua. Face camera ke samne rakhein.";

            return;

        }


        /*
           Check existing registration
        */

        const q =
            query(

                collection(
                    db,
                    "teacherFaces"
                ),

                where(
                    "name",
                    "==",
                    currentUser
                )

            );


        const existing =
            await getDocs(q);


        if(!existing.empty){

            status.innerText =
                "⚠️ Is teacher ka face pehle se registered hai.";

            return;

        }


        await addDoc(

            collection(
                db,
                "teacherFaces"
            ),

            {

                name:currentUser,

                descriptor:descriptor,

                createdAt:
                    serverTimestamp()

            }

        );


        status.innerText =
            "✅ Face successfully registered.";


    }catch(error){

        console.error(
            "Registration Error:",
            error
        );


        status.innerText =
            "❌ Face registration failed.";

    }

};


/* =====================================================
   EUCLIDEAN DISTANCE
===================================================== */

function euclideanDistance(
    descriptor1,
    descriptor2
){

    let sum = 0;


    const length =
        Math.min(
            descriptor1.length,
            descriptor2.length
        );


    for(
        let i = 0;
        i < length;
        i++
    ){

        const difference =
            descriptor1[i]
            -
            descriptor2[i];


        sum +=
            difference *
            difference;

    }


    return Math.sqrt(sum);

}


/* =====================================================
   MARK ATTENDANCE
===================================================== */

window.markAttendance =
async function(){

    const status =
        document.getElementById(
            "attendanceStatus"
        );


    if(!currentUser){

        status.innerText =
            "❌ Pehle Teacher Login karein.";

        return;

    }


    status.innerText =
        "⏳ Face match ho raha hai...";


    try{

        /*
           Load models
        */

        const loaded =
            await loadFaceModels();


        if(!loaded){

            status.innerText =
                "❌ Face models load nahi hue.";

            return;

        }


        /*
           Current date
        */

        const now =
            new Date();


        const day =
            String(
                now.getDate()
            ).padStart(2,"0");


        const month =
            String(
                now.getMonth()+1
            ).padStart(2,"0");


        const year =
            now.getFullYear();


        const date =
            day +
            "/" +
            month +
            "/" +
            year;


        const time =
            now.toLocaleTimeString(
                "en-GB"
            );


        /*
           Current camera
        */

        const video =
            getVideo(
                "videoAttendance"
            );


        if(
            !video ||
            !video.srcObject
        ){

            status.innerText =
                "❌ Pehle Start Camera dabayein.";

            return;

        }


        /*
           Detect current face FIRST
        */

        status.innerText =
            "🔍 Face detect ho raha hai...";


        const currentDescriptor =
            await getFaceDescriptor(
                video
            );


        if(!currentDescriptor){

            status.innerText =
                "❌ Face detect nahi hua. Camera ke samne face clear rakhein.";

            return;

        }


        /*
           Get registered face
        */

        status.innerText =
            "🔄 Registered face se match ho raha hai...";


        const faceQuery =
            query(

                collection(
                    db,
                    "teacherFaces"
                ),

                where(
                    "name",
                    "==",
                    currentUser
                )

            );


        const faceSnapshot =
            await getDocs(
                faceQuery
            );


        if(faceSnapshot.empty){

            status.innerText =
                "❌ Pehle Face Registration karein.";

            return;

        }


        const faceDoc =
            faceSnapshot.docs[0].data();


        const registeredDescriptor =
            faceDoc.descriptor;


        /*
           Face matching
        */

        const distance =
            euclideanDistance(

                currentDescriptor,

                registeredDescriptor

            );


        console.log(
            "Face distance:",
            distance
        );


        /*
           Threshold
        */

        if(distance > 0.55){

            status.innerText =
                "❌ Face match nahi hua.";

            return;

        }


        /*
           Duplicate check
        */

        status.innerText =
            "🔍 Attendance check ho rahi hai...";


        const duplicateQuery =
            query(

                collection(
                    db,
                    "attendance"
                ),

                where(
                    "name",
                    "==",
                    currentUser
                ),

                where(
                    "date",
                    "==",
                    date
                )

            );


        const duplicateSnapshot =
            await getDocs(
                duplicateQuery
            );


        if(!duplicateSnapshot.empty){

            status.innerText =
                "⚠️ Aaj ki attendance already marked hai.";

            return;

        }


        /*
           Save attendance
        */

        await addDoc(

            collection(
                db,
                "attendance"
            ),

            {

                name:currentUser,

                status:"Present",

                date:date,

                time:time,

                createdAt:
                    serverTimestamp()

            }

        );


        status.innerText =
            "☁️ Firebase mein save ho gaya. ✅ Attendance Marked";


    }catch(error){

        console.error(
            "Attendance Error:",
            error
        );


        status.innerText =
            "❌ Attendance failed: " +
            error.message;

    }

};


/* =====================================================
   AUTO OPEN MENU AFTER PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        if(currentUser){

            document.getElementById(
                "welcomeText"
            ).innerText =
                "Welcome " + currentUser;


            showOnly("menuPage");

        }else{

            showOnly("loginPage");

        }

    }
);

</script>

</body>
</html>
