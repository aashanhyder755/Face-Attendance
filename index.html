<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 15px;
    }

    video {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }

    input {
      padding: 12px;
      width: 80%;
      max-width: 350px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      white-space: pre-line;
    }

    #history {
      margin-top: 20px;
      text-align: left;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .record {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>Face Attendance</h1>

<input id="name" type="text" placeholder="Teacher Name">

<br>

<button onclick="startCamera()">Start Camera</button>
<button onclick="registerFace()">Register Face</button>
<button onclick="checkFace()">Mark Attendance</button>

<br>

<button onclick="showHistory()">Attendance History</button>
<button onclick="clearHistory()">Clear History</button>

<br>

<video id="camera" autoplay muted playsinline></video>

<h3 id="status">Loading...</h3>

<div id="history"></div>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",
  authDomain: "teachers-face-attendance.firebaseapp.com",
  projectId: "teachers-face-attendance",
  storageBucket: "teachers-face-attendance.firebasestorage.app",
  messagingSenderId: "63876838606",
  appId: "1:63876838606:web:572e240079865aabbc4c9f",
  measurementId: "G-XN93NKWLY5"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let stream = null;
let registeredName = "";
let registeredDescriptor = null;

const MODEL_URL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";


async function loadModels() {

  try {

    document.getElementById("status").innerText =
      "Loading face recognition...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

    const saved =
      localStorage.getItem("registeredFace");

    if (saved) {

      const data = JSON.parse(saved);

      registeredName = data.name;

      registeredDescriptor =
        new Float32Array(data.descriptor);

      document.getElementById("name").value =
        registeredName;

      document.getElementById("status").innerText =
        registeredName +
        " ka face already registered ✅";

    } else {

      document.getElementById("status").innerText =
        "Models loaded ✅ Start Camera";

    }

  } catch (error) {

    console.log(error);

    document.getElementById("status").innerText =
      "Model loading error";

  }

}


async function startCamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },

        audio: false

      });

    const video =
      document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    document.getElementById("status").innerText =
      "Camera started successfully ✅";

  } catch (error) {

    document.getElementById("status").innerText =
      "Camera error: " + error.name;

  }

}


async function registerFace() {

  const name =
    document.getElementById("name").value.trim();

  const video =
    document.getElementById("camera");

  if (!name) {

    alert("Pehle teacher ka naam likhein.");

    return;
  }

  if (!stream) {

    alert("Pehle Start Camera dabayein.");

    return;
  }

  document.getElementById("status").innerText =
    "Face scan ho raha hai...";

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 416,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {

    document.getElementById("status").innerText =
      "Face detect nahi hua.";

    return;
  }

  registeredName = name;

  registeredDescriptor =
    Array.from(detection.descriptor);

  localStorage.setItem(
    "registeredFace",
    JSON.stringify({

      name: registeredName,

      descriptor: registeredDescriptor

    })
  );

  registeredDescriptor =
    new Float32Array(registeredDescriptor);

  document.getElementById("status").innerText =
    registeredName +
    " ka face register ho gaya ✅";

}


async function checkFace() {

  if (!registeredDescriptor) {

    alert("Pehle face Register karein.");

    return;
  }

  if (!stream) {

    alert("Pehle Start Camera dabayein.");

    return;
  }

  const video =
    document.getElementById("camera");

  document.getElementById("status").innerText =
    "Face match ho raha hai...";

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 416,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {

    document.getElementById("status").innerText =
      "Face detect nahi hua.";

    return;
  }

  const distance =
    faceapi.euclideanDistance(
      registeredDescriptor,
      detection.descriptor
    );

  if (distance < 0.55) {

    const now = new Date();

    const date =
      now.toLocaleDateString();

    const time =
      now.toLocaleTimeString();

    const attendance = {

      name: registeredName,

      status: "Present",

      date: date,

      time: time

    };


    /* Local history */

    let history =
      JSON.parse(
        localStorage.getItem("attendanceHistory")
      ) || [];

    history.push(attendance);

    localStorage.setItem(
      "attendanceHistory",
      JSON.stringify(history)
    );


    /* Firebase Firestore */

    try {

      await addDoc(
        collection(db, "attendance"),
        attendance
      );

      document.getElementById("status").innerText =
        "✅ " +
        registeredName +
        " Present\n" +
        date +
        " " +
        time +
        "\n☁️ Firebase mein save ho gaya";

    } catch (error) {

      console.error(error);

      document.getElementById("status").innerText =
        "Attendance local mein save hui,\n" +
        "lekin Firebase mein save nahi hui.\n" +
        error.message;

    }

  } else {

    document.getElementById("status").innerText =
      "❌ Face match nahi hua.";

  }

}


function showHistory() {

  const history =
    JSON.parse(
      localStorage.getItem("attendanceHistory")
    ) || [];

  const box =
    document.getElementById("history");

  if (history.length === 0) {

    box.innerHTML =
      "<h3>Attendance History</h3><p>No record found.</p>";

    return;
  }

  let html =
    "<h3>Attendance History</h3>";

  history
    .slice()
    .reverse()
    .forEach(function(record) {

      html +=
        '<div class="record">' +

        "<b>Name:</b> " +
        record.name +

        "<br>" +

        "<b>Status:</b> " +
        record.status +

        "<br>" +

        "<b>Date:</b> " +
        record.date +

        "<br>" +

        "<b>Time:</b> " +
        record.time +

        "</div>";

    });

  box.innerHTML = html;

}


function clearHistory() {

  if (
    confirm(
      "Kya aap Attendance History delete karna chahte hain?"
    )
  ) {

    localStorage.removeItem(
      "attendanceHistory"
    );

    document.getElementById("history").innerHTML =
      "";

    document.getElementById("status").innerText =
      "Attendance History clear ho gayi.";

  }

}


loadModels();
window.startCamera = startCamera;
window.registerFace = registerFace;
window.checkFace = checkFace;
window.showHistory = showHistory;
window.clearHistory = clearHistory;
</script>

</body>
</html>
