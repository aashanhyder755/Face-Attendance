<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers Face Attendance</title>

<style>
body{

</head>

<body>

<div class="container">

<h1>👨‍🏫 Teachers Face Attendance</h1>


<!-- =========================
     SIGNUP / LOGIN
========================= -->

<div id="authSection">

    <div id="signupBox" class="auth-box">

        <h2>📝 Teacher Signup</h2>

        <input
            type="text"
            id="signupName"
            placeholder="Teacher Name"
        >

        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <input
            type="password"
            id="signupConfirm"
            placeholder="Confirm Password"
        >

        <button onclick="signup()">
            📝 Create Account
        </button>

        <button onclick="showLogin()">
            Already have account? Login
        </button>

    </div>


    <div id="loginBox" class="auth-box hidden">

        <h2>🔐 Teacher Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="login()">
            🔐 Login
        </button>

        <button onclick="showSignup()">
            Create New Account
        </button>

    </div>

</div>


<!-- =========================
     TEACHER APP
========================= -->

<div id="appSection" class="hidden">

    <h3 id="welcome"></h3>

    <button onclick="startCamera()">
        📷 Start Camera
    </button>

    <button onclick="registerFace()">
        👤 Register My Face
    </button>

    <button onclick="checkFace()">
        ✅ Mark Attendance
    </button>

    <button onclick="showHistory()">
        📋 Show My History
    </button>

    <button onclick="clearHistory()">
        🗑️ Clear Local History
    </button>

    <button class="logout" onclick="logout()">
        🚪 Logout
    </button>

    <video id="camera" autoplay muted playsinline></video>

</div>


<div id="status">
    Loading...
</div>

<div id="history"></div>

</div>


<script type="module">


/* =========================
   FIREBASE APP
========================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


/* =========================
   FIREBASE AUTH
========================= */

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =========================
   FIRESTORE
========================= */

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",

    authDomain:
    "teachers-face-attendance.firebaseapp.com",

    projectId:
    "teachers-face-attendance",

    storageBucket:
    "teachers-face-attendance.firebasestorage.app",

    messagingSenderId:
    "63876838606",

    appId:
    "1:63876838606:web:572e240079865aabbc4c9f",

    measurementId:
    "G-XN93NKWLY5"

};


/* =========================
   INITIALIZE
========================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================
   CURRENT USER
========================= */

let currentUser = null;


/* =========================
   SHOW SIGNUP
========================= */

function showSignup(){

    document
    .getElementById("signupBox")
    .classList.remove("hidden");

    document
    .getElementById("loginBox")
    .classList.add("hidden");

    document
    .getElementById("status")
    .innerText =
    "Create your teacher account.";

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

    document
    .getElementById("signupBox")
    .classList.add("hidden");

    document
    .getElementById("loginBox")
    .classList.remove("hidden");

    document
    .getElementById("status")
    .innerText =
    "Login to your account.";

}


/* =========================
   SIGNUP
========================= */

async function signup(){

    const name =
    document
    .getElementById("signupName")
    .value
    .trim();

    const email =
    document
    .getElementById("signupEmail")
    .value
    .trim();

    const password =
    document
    .getElementById("signupPassword")
    .value;

    const confirmPassword =
    document
    .getElementById("signupConfirm")
    .value;


    if(!name){

        alert("Teacher name likhein.");

        return;
    }


    if(!email){

        alert("Email likhein.");

        return;
    }


    if(password.length < 6){

        alert(
            "Password kam az kam 6 characters ka hona chahiye."
        );

        return;
    }


    if(password !== confirmPassword){

        alert(
            "Password aur Confirm Password same nahi hain."
        );

        return;
    }


    try{

        document
        .getElementById("status")
        .innerText =
        "⏳ Account ban raha hai...";


        const userCredential =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        userCredential.user;


        await updateProfile(
            user,
            {
                displayName:name
            }
        );


        /* Save teacher profile */

        await setDoc(
            doc(db,"teacherAccounts",user.uid),
            {

                uid:user.uid,

                name:name,

                email:email,

                createdAt:
                new Date().toISOString()

            }
        );


        alert(
            "✅ Account successfully create ho gaya."
        );


        currentUser=user;

        openTeacherApp();


    }catch(error){

        console.error(error);

        let message =
        error.message;


        if(error.code ===
        "auth/email-already-in-use"){

            message =
            "Ye email pehle se registered hai.";

        }


        if(error.code ===
        "auth/invalid-email"){

            message =
            "Email address sahi nahi hai.";

        }


        document
        .getElementById("status")
        .innerText =
        "❌ Signup error";


        alert(message);

    }

}


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();

    const password =
    document
    .getElementById("loginPassword")
    .value;


    if(!email){

        alert("Email likhein.");

        return;
    }


    if(!password){

        alert("Password likhein.");

        return;
    }


    try{

        document
        .getElementById("status")
        .innerText =
        "⏳ Login ho raha hai...";


        const userCredential =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        currentUser =
        userCredential.user;


        openTeacherApp();


    }catch(error){

        console.error(error);

        let message =
        "Email ya password ghalat hai.";


        if(
            error.code ===
            "auth/user-not-found"
        ){

            message =
            "Ye account registered nahi hai.";

        }


        if(
            error.code ===
            "auth/wrong-password"
        ){

            message =
            "Password ghalat hai.";

        }


        document
        .getElementById("status")
        .innerText =
        "❌ Login failed";


        alert(message);

    }

}


/* =========================
   OPEN TEACHER APP
========================= */

async function openTeacherApp(){

    document
    .getElementById("authSection")
    .classList.add("hidden");


    document
    .getElementById("appSection")
    .classList.remove("hidden");


    let teacherName =
    currentUser.displayName;


    if(!teacherName){

        try{

            const accountDoc =
            await getDoc(
                doc(
                    db,
                    "teacherAccounts",
                    currentUser.uid
                )
            );


            if(accountDoc.exists()){

                teacherName =
                accountDoc.data().name;

            }

        }catch(error){

            console.error(error);

        }

    }


    document
    .getElementById("welcome")
    .innerText =
    "👋 Welcome " +
    (teacherName || currentUser.email);


    document
    .getElementById("status")
    .innerText =
    "✅ Login successful";

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    try{

        await signOut(auth);

        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

            stream=null;
        }


        document
        .getElementById("appSection")
        .classList.add("hidden");


        document
        .getElementById("authSection")
        .classList.remove("hidden");


        showLogin();


        document
        .getElementById("status")
        .innerText =
        "Logged out";


    }catch(error){

        console.error(error);

    }

}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(user){

            currentUser=user;

            openTeacherApp();

        }else{

            currentUser=null;

            document
            .getElementById("appSection")
            .classList.add("hidden");

            document
            .getElementById("authSection")
            .classList.remove("hidden");

            showSignup();

        }

    }
);


/* =========================
   FACE API
========================= */

const faceapiScript =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js";

const modelURL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

let faceapiLoaded=false;


/* =========================
   LOAD FACE API
========================= */

function loadFaceApi(){

    return new Promise(
    (resolve,reject)=>{

        const script =
        document.createElement("script");

        script.src =
        faceapiScript;


        script.onload =
        async()=>{

            try{

                await faceapi
                .nets
                .tinyFaceDetector
                .loadFromUri(
                    modelURL
                );


                await faceapi
                .nets
                .faceLandmark68Net
                .loadFromUri(
                    modelURL
                );


                await faceapi
                .nets
                .faceRecognitionNet
                .loadFromUri(
                    modelURL
                );


                faceapiLoaded=true;


                document
                .getElementById("status")
                .innerText =
                "✅ System ready";


                resolve();


            }catch(error){

                console.error(error);

                document
                .getElementById("status")
                .innerText =
                "❌ Face model load nahi hua";


                reject(error);

            }

        };


        script.onerror=()=>{

            document
            .getElementById("status")
            .innerText =
            "❌ Face API load nahi hui";


            reject();

        };


        document
        .head
        .appendChild(script);

    });

}


/* =========================
   CAMERA
========================= */

let stream=null;


async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });


        const video =
        document
        .getElementById("camera");


        video.srcObject =
        stream;


        await video.play();


        document
        .getElementById("status")
        .innerText =
        "📷 Camera started";


    }catch(error){

        console.error(error);


        document
        .getElementById("status")
        .innerText =
        "❌ Camera permission required";

    }

}


/* =========================
   SCHOOL LOCATION
========================= */

const SCHOOL_LOCATION_DOC =
"schoolLocation";

const SCHOOL_RADIUS =
100;


/* =========================
   SET SCHOOL LOCATION
========================= */

async function setSchoolLocation(){

    if(!currentUser){

        alert("Pehle login karein.");

        return;
    }


    if(!navigator.geolocation){

        alert("GPS supported nahi hai.");

        return;
    }


    try{

        const oldLocation =
        await getDoc(
            doc(
                db,
                "settings",
                SCHOOL_LOCATION_DOC
            )
        );


        if(oldLocation.exists()){

            alert(
                "School location pehle se set hai."
            );

            return;
        }


        document
        .getElementById("status")
        .innerText =
        "📍 School GPS location li ja rahi hai...";


        navigator.geolocation.getCurrentPosition(

            async(position)=>{

                const latitude =
                position.coords.latitude;

                const longitude =
                position.coords.longitude;

                const accuracy =
                position.coords.accuracy;


                try{

                    await setDoc(

                        doc(
                            db,
                            "settings",
                            SCHOOL_LOCATION_DOC
                        ),

                        {

                            schoolName:
                            "Moon Star Public High School Khanwahan",

                            latitude:
                            latitude,

                            longitude:
                            longitude,

                            radius:
                            SCHOOL_RADIUS,

                            accuracy:
                            accuracy,

                            setAt:
                            new Date().toISOString()

                        }

                    );


                    document
                    .getElementById("status")
                    .innerText =
                    "✅ School location saved";


                    alert(
                        "✅ School location save ho gayi.\n\n" +
                        "GPS Accuracy: " +
                        Math.round(accuracy) +
                        " meters\n\n" +
                        "Radius: 100 meters"
                    );


                }catch(error){

                    console.error(error);

                    alert(
                        "Firebase permission error:\n\n" +
                        error.message
                    );

                }

            },

            (error)=>{

                console.error(error);

                alert(
                    "GPS location nahi mili.\n\n" +
                    "Phone ki Location ON karein aur permission Allow karein."
                );

            },

            {

                enableHighAccuracy:true,

                timeout:20000,

                maximumAge:0

            }

        );

    }catch(error){

        console.error(error);

        alert(error.message);

    }

}


/* =========================
   DISTANCE
========================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;


    const dLat =
    (lat2-lat1)
    *Math.PI/180;


    const dLon =
    (lon2-lon1)
    *Math.PI/180;


    const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(
        lat1*Math.PI/180
    ) *

    Math.cos(
        lat2*Math.PI/180
    ) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


    const c =
    2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );


    return R*c;

}


/* =========================
   CHECK SCHOOL LOCATION
========================= */

async function checkSchoolLocation(){

    try{

        const locationDoc =
        await getDoc(
            doc(
                db,
                "settings",
                SCHOOL_LOCATION_DOC
            )
        );


        if(!locationDoc.exists()){

            alert(
                "School location abhi set nahi hai."
            );

            return false;
        }


        const school =
        locationDoc.data();


        return new Promise(
        (resolve)=>{


            navigator.geolocation.getCurrentPosition(

                (position)=>{

                    const currentLat =
                    position.coords.latitude;

                    const currentLon =
                    position.coords.longitude;


                    const distance =
                    calculateDistance(

                        school.latitude,

                        school.longitude,

                        currentLat,

                        currentLon

                    );


                    console.log(
                        "Distance:",
                        distance
                    );


                    if(
                        distance <=
                        SCHOOL_RADIUS
                    ){

                        document
                        .getElementById("status")
                        .innerText =
                        "✅ School location verified (" +
                        Math.round(distance) +
                        "m)";


                        resolve(true);

                    }else{

                        document
                        .getElementById("status")
                        .innerText =
                        "❌ School se " +
                        Math.round(distance) +
                        "m door";


                        alert(
                            "❌ Attendance nahi lagegi.\n\n" +
                            "Aap school ke 100 meter radius mein nahi hain."
                        );


                        resolve(false);

                    }

                },

                (error)=>{

                    console.error(error);

                    alert(
                        "Current GPS location nahi mili."
                    );

                    resolve(false);

                },

                {

                    enableHighAccuracy:true,

                    timeout:20000,

                    maximumAge:0

                }

            );

        });


    }catch(error){

        console.error(error);

        return false;

    }

}


/* =========================
   GET TEACHER NAME
========================= */

async function getMyTeacherName(){

    if(!currentUser){

        return null;
    }


    if(currentUser.displayName){

        return currentUser.displayName;
    }


    try{

        const accountDoc =
        await getDoc(
            doc(
                db,
                "teacherAccounts",
                currentUser.uid
            )
        );


        if(accountDoc.exists()){

            return accountDoc.data().name;

        }

    }catch(error){

        console.error(error);

    }


    return null;

}


/* =========================
   REGISTER FACE
========================= */

async function registerFace(){

    if(!currentUser){

        alert("Pehle login karein.");

        return;
    }


    if(!faceapiLoaded){

        alert(
            "Face system abhi load ho raha hai."
        );

        return;
    }


    const name =
    await getMyTeacherName();


    if(!name){

        alert(
            "Teacher name account mein nahi mila."
        );

        return;
    }


    const video =
    document
    .getElementById("camera");


    document
    .getElementById("status")
    .innerText =
    "👤 Face detect ho raha hai...";


    try{

        const detection =
        await faceapi

        .detectSingleFace(

            video,

            new faceapi
            .TinyFaceDetectorOptions({

                inputSize:320,

                scoreThreshold:0.4

            })

        )

        .withFaceLandmarks()

        .withFaceDescriptor();


        if(!detection){

            document
            .getElementById("status")
            .innerText =
            "❌ Face detect nahi hua";

            return;
        }


        const teachersSnapshot =
        await getDocs(
            collection(db,"teachers")
        );


        let alreadyRegistered=false;


        teachersSnapshot.forEach(
        docSnap=>{

            const teacher =
            docSnap.data();


            if(
                teacher.uid ===
                currentUser.uid
            ){

                alreadyRegistered=true;

            }

        });


        if(alreadyRegistered){

            alert(
                "Aapka face pehle se registered hai."
            );

            return;
        }


        await addDoc(

            collection(db,"teachers"),

            {

                uid:
                currentUser.uid,

                name:
                name,

                email:
                currentUser.email,

                descriptor:
                Array.from(
                    detection.descriptor
                ),

                registeredAt:
                new Date().toISOString()

            }

        );


        document
        .getElementById("status")
        .innerText =
        "✅ " +
        name +
        " ka face register ho gaya";


        alert(
            "✅ Aapka face successfully registered ho gaya."
        );


    }catch(error){

        console.error(error);

        document
        .getElementById("status")
        .innerText =
        "❌ Face registration error";


        alert(error.message);

    }

}


/* =========================
   MARK ATTENDANCE
========================= */

async function checkFace(){

    if(!currentUser){

        alert("Pehle login karein.");

        return;
    }


    if(!faceapiLoaded){

        alert(
            "Face system abhi load ho raha hai."
        );

        return;
    }


    /* LOCATION */

    const locationOK =
    await checkSchoolLocation();


    if(!locationOK){

        return;
    }


    const video =
    document
    .getElementById("camera");


    const myName =
    await getMyTeacherName();


    document
    .getElementById("status")
    .innerText =
    "👤 Face match ho raha hai...";


    try{

        const detection =
        await faceapi

        .detectSingleFace(

            video,

            new faceapi
            .TinyFaceDetectorOptions({

                inputSize:320,

                scoreThreshold:0.4

            })

        )

        .withFaceLandmarks()

        .withFaceDescriptor();


        if(!detection){

            document
            .getElementById("status")
            .innerText =
            "❌ Face detect nahi hua";

            return;
        }


        const teachersSnapshot =
        await getDocs(
            collection(db,"teachers")
        );


        let bestMatch=null;

        let bestDistance=Infinity;


        teachersSnapshot.forEach(
        docSnap=>{

            const teacher =
            docSnap.data();


            /* Only logged-in teacher */

            if(
                teacher.uid !==
                currentUser.uid
            ){

                return;
            }


            if(
                !teacher.descriptor
            ){

                return;
            }


            const savedDescriptor =
            new Float32Array(
                teacher.descriptor
            );


            const distance =
            faceapi.euclideanDistance(

                detection.descriptor,

                savedDescriptor

            );


            if(
                distance <
                bestDistance
            ){

                bestDistance =
                distance;

                bestMatch =
                teacher;

            }

        });


        if(
            !bestMatch ||
            bestDistance >= 0.55
        ){

            document
            .getElementById("status")
            .innerText =
            "❌ Aapka face match nahi hua";


            alert(
                "Face match nahi hua.\n\n" +
                "Agar pehli baar hai to Register My Face karein."
            );


            return;
        }


        const today =
        new Date()
        .toLocaleDateString();


        const now =
        new Date()
        .toLocaleTimeString();


        /* =========================
           DUPLICATE CHECK
        ========================= */

        const attendanceSnapshot =
        await getDocs(
            collection(db,"attendance")
        );


        let alreadyPresent=false;


        attendanceSnapshot.forEach(
        docSnap=>{

            const record =
            docSnap.data();


            if(

                record.uid ===
                currentUser.uid &&

                record.date ===
                today &&

                record.status ===
                "Present"

            ){

                alreadyPresent=true;

            }

        });


        if(alreadyPresent){

            document
            .getElementById("status")
            .innerText =
            "⚠️ Aaj attendance already lag chuki hai";


            alert(
                "⚠️ Aaj aapki attendance already present hai."
            );


            return;
        }


        const attendance={

            uid:
            currentUser.uid,

            name:
            bestMatch.name,

            email:
            currentUser.email,

            status:
            "Present",

            date:
            today,

            time:
            now

        };


        await addDoc(

            collection(db,"attendance"),

            attendance

        );


        /* LOCAL HISTORY */

        const history =
        JSON.parse(

            localStorage.getItem(
                "attendanceHistory_" +
                currentUser.uid
            ) ||
            "[]"

        );


        history.push(attendance);


        localStorage.setItem(

            "attendanceHistory_" +
            currentUser.uid,

            JSON.stringify(history)

        );


        document
        .getElementById("status")
        .innerText =
        "✅ Attendance marked successfully";


        alert(

            "✅ Attendance successful!\n\n" +

            bestMatch.name +
            "\n" +

            today +
            "\n" +

            now

        );


    }catch(error){

        console.error(error);


        document
        .getElementById("status")
        .innerText =
        "❌ Attendance error";


        alert(
            "Attendance error:\n\n" +
            error.message
        );

    }

}


/* =========================
   HISTORY
========================= */

function showHistory(){

    if(!currentUser){

        return;
    }


    const history =
    JSON.parse(

        localStorage.getItem(

            "attendanceHistory_" +
            currentUser.uid

        ) ||
        "[]"

    );


    const historyDiv =
    document
    .getElementById("history");


    if(history.length===0){

        historyDiv.innerHTML =
        "<p>No attendance history.</p>";

        return;
    }


    let html =
    "<h3>My Attendance History</h3>";


    history
    .slice()
    .reverse()
    .forEach(
    record=>{

        html +=

        "<p>" +

        "👤 " +
        record.name +

        "<br>" +

        "📅 " +
        record.date +

        "<br>" +

        "⏰ " +
        record.time +

        "<br>" +

        "✅ " +
        record.status +

        "</p><hr>";

    });


    historyDiv.innerHTML =
    html;

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory(){

    if(!currentUser){

        return;
    }


    if(
        confirm(
            "Local history clear karni hai?"
        )
    ){

        localStorage.removeItem(

            "attendanceHistory_" +
            currentUser.uid

        );


        document
        .getElementById("history")
        .innerHTML =
        "";


        document
        .getElementById("status")
        .innerText =
        "🗑️ Local history cleared";

    }

}
