<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
==================================================
IMPORTANT
==================================================

Yahan APNI EXISTING WORKING FIREBASE CONFIG rakhein.

Agar aapke purane index.html mein Firebase config
already working hai to usi config ko yahan paste karein.

==================================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "teachers-face-attendance.firebaseapp.com",

    projectId: "teachers-face-attendance",

    storageBucket: "teachers-face-attendance.appspot.com",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* Make Firebase database available */

window.db = db;

window.firebaseCollection = collection;
window.firebaseAddDoc = addDoc;
window.firebaseGetDocs = getDocs;
window.firebaseQuery = query;
window.firebaseWhere = where;
window.firebaseServerTimestamp = serverTimestamp;


/* =========================
   GLOBAL VARIABLES
========================= */

let teacherName = "";

let videoStream = null;

let registeredDescriptor = null;

let modelsLoaded = false;


/* =========================
   LOGIN
========================= */

    -----------------------------------------
    */

};

/* =========================

/* =========================
   LOAD FACE MODELS
========================= */

async function loadFaceModels(){

    if(modelsLoaded){

        return;

    }

    try{

        const MODEL_URL =
            "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

        await faceapi.nets.tinyFaceDetector.loadFromUri(
            MODEL_URL
        );

        await faceapi.nets.faceLandmark68Net.loadFromUri(
            MODEL_URL
        );

        await faceapi.nets.faceRecognitionNet.loadFromUri(
            MODEL_URL
        );

        modelsLoaded = true;

    }
    catch(error){

        console.error(error);

        alert(
            "Face models load nahi ho rahe. Internet check karein."
        );

        throw error;

    }

}


/* =========================
   REGISTRATION CAMERA
========================= */

window.startCamera = async function(){

    try{

        stopCamera();

        videoStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        const video =
            document.getElementById("video");

        video.srcObject = videoStream;

        await video.play();

        document.getElementById("registrationStatus")
            .textContent =
            "✅ Camera ready hai. Face camera ke samne rakhein.";

    }
    catch(error){

        console.error(error);

        document.getElementById("registrationStatus")
            .textContent =
            "❌ Camera permission required.";

    }

};


/* =========================
   ATTENDANCE CAMERA
========================= */

window.startAttendanceCamera = async function(){

    try{

        stopCamera();

        videoStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        const video =
            document.getElementById("videoAttendance");

        video.srcObject = videoStream;

        await video.play();

        document.getElementById("attendanceStatus")
            .textContent =
            "✅ Camera ready hai. Face camera ke samne rakhein.";

    }
    catch(error){

        console.error(error);

        document.getElementById("attendanceStatus")
            .textContent =
            "❌ Camera permission required.";

    }

};


/* =========================
   STOP CAMERA
========================= */

window.stopCamera = function(){

    if(videoStream){

        videoStream.getTracks().forEach(
            track => track.stop()
        );

        videoStream = null;

    }


    const video1 =
        document.getElementById("video");

    const video2 =
        document.getElementById("videoAttendance");


    if(video1){

        video1.srcObject = null;

    }

    if(video2){

        video2.srcObject = null;

    }

};


/* =========================
   CURRENT VIDEO
========================= */

function getCurrentVideo(){

    const attendancePage =
        document.getElementById("attendancePage");

    if(
        !attendancePage.classList.contains("hidden")
    ){

        return document.getElementById(
            "videoAttendance"
        );

    }

    return document.getElementById("video");

}


/* =========================
   GET FACE DESCRIPTOR
========================= */

async function getFaceDescriptor(){

    const video = getCurrentVideo();


    if(!video){

        throw new Error(
            "Camera video nahi mila."
        );

    }


    if(video.readyState < 2){

        throw new Error(
            "Camera abhi ready nahi hai."
        );

    }


    const detection =
        await faceapi
        .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize:320,
                scoreThreshold:0.5
            })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if(!detection){

        return null;

    }


    return detection.descriptor;

}


/* =========================
   REGISTER FACE
========================= */

window.registerFace = async function(){

    if(!teacherName){

        alert("Pehle login karein.");

        return;

    }


    const status =
        document.getElementById(
            "registrationStatus"
        );


    try{

        status.textContent =
            "🔍 Face detection ho rahi hai...";


        await loadFaceModels();


        const video =
            document.getElementById("video");


        if(!video.srcObject){

            status.textContent =
                "❌ Pehle Start Camera dabayein.";

            return;

        }


        const descriptor =
            await getFaceDescriptor();


        if(!descriptor){

            status.textContent =
                "❌ Face detect nahi hua. Face camera ke samne rakhein.";

            return;

        }


        /* Check existing registration */

        const q =
            firebaseQuery(
                firebaseCollection(
                    db,
                    "teacherFaces"
                ),
                firebaseWhere(
                    "name",
                    "==",
                    teacherName
                )
            );


        const snapshot =
            await firebaseGetDocs(q);


        if(!snapshot.empty){

            status.textContent =
                "⚠️ Is teacher ka face pehle se registered hai.";

            return;

        }


        await firebaseAddDoc(

            firebaseCollection(
                db,
                "teacherFaces"
            ),

            {

                name:teacherName,

                descriptor:Array.from(
                    descriptor
                ),

                createdAt:
                    firebaseServerTimestamp()

            }

        );


        registeredDescriptor =
            descriptor;


        status.textContent =
            "✅ Face successfully register ho gaya.";

    }
    catch(error){

        console.error(error);

        status.textContent =
            "❌ Face registration error: "
            + error.message;

    }

};


/* =========================
   GET REGISTERED FACE
========================= */

async function getRegisteredFace(){

    const q =
        firebaseQuery(

            firebaseCollection(
                db,
                "teacherFaces"
            ),

            firebaseWhere(
                "name",
                "==",
                teacherName
            )

        );


    const snapshot =
        await firebaseGetDocs(q);


    if(snapshot.empty){

        return null;

    }


    const data =
        snapshot.docs[0].data();


    if(!data.descriptor){

        return null;

    }


    return new Float32Array(
        data.descriptor
    );

}


/* =========================
   FACE MATCH
========================= */

function faceMatch(
    descriptor1,
    descriptor2
){

    const distance =
        faceapi.euclideanDistance(
            descriptor1,
            descriptor2
        );


    console.log(
        "Face distance:",
        distance
    );


    return distance < 0.55;

}


/* =========================
   CHECK DUPLICATE ATTENDANCE
========================= */

async function alreadyMarkedToday(){

    const today =
        new Date()
        .toLocaleDateString(
            "en-GB"
        )
        .replaceAll(
            "-",
            "/"
        );


    const q =
        firebaseQuery(

            firebaseCollection(
                db,
                "attendance"
            ),

            firebaseWhere(
                "name",
                "==",
                teacherName
            ),

            firebaseWhere(
                "date",
                "==",
                today
            )

        );


    const snapshot =
        await firebaseGetDocs(q);


    return !snapshot.empty;

}


/* =========================
   LOCATION CHECK
========================= */

const LOCATION_CHECK = false;


async function checkLocation(){

    if(!LOCATION_CHECK){

        return true;

    }


    return new Promise(
        (resolve)=>{

            if(!navigator.geolocation){

                resolve(false);

                return;

            }


            navigator.geolocation.getCurrentPosition(

                ()=>resolve(true),

                ()=>resolve(false)

            );

        }
    );

}


/* =========================
   MARK ATTENDANCE
========================= */

window.markAttendance = async function(){

    if(!teacherName){

        alert("Pehle login karein.");

        return;

    }


    const status =
        document.getElementById(
            "attendanceStatus"
        );


    try{

        status.textContent =
            "🔎 Attendance check ho rahi hai...";


        await loadFaceModels();


        /* Duplicate check */

        const duplicate =
            await alreadyMarkedToday();


        if(duplicate){

            status.textContent =
                "⚠️ Aaj ki attendance pehle hi lag chuki hai.";

            return;

        }


        /* Location */

        const locationOK =
            await checkLocation();


        if(!locationOK){

            status.textContent =
                "❌ Location permission required.";

            return;

        }


        /* Registered face */

        let registered =
            registeredDescriptor;


        if(!registered){

            registered =
                await getRegisteredFace();

        }


        if(!registered){

            status.textContent =
                "❌ Pehle apna face register karein.";

            return;

        }


        /* Camera check */

        const video =
            document.getElementById(
                "videoAttendance"
            );


        if(!video.srcObject){

            status.textContent =
                "❌ Pehle Start Camera dabayein.";

            return;

        }


        status.textContent =
            "🔍 Face match ho raha hai...";


        const currentDescriptor =
            await getFaceDescriptor();


        if(!currentDescriptor){

            status.textContent =
                "❌ Face detect nahi hua. Camera ke samne seedha dekhein.";

            return;

        }


        /* Match */

        const matched =
            faceMatch(
                currentDescriptor,
                registered
            );


        if(!matched){

            status.textContent =
                "❌ Face match nahi hua.";

            return;

        }


        /* Date and time */

        const now =
            new Date();


        const date =
            now.toLocaleDateString(
                "en-GB"
            )
            .replaceAll(
                "-",
                "/"
            );


        const time =
            now.toLocaleTimeString(
                "en-GB"
            );


        /* Save */

        await firebaseAddDoc(

            firebaseCollection(
                db,
                "attendance"
            ),

            {

                name:teacherName,

                status:"Present",

                date:date,

                time:time,

                createdAt:
                    firebaseServerTimestamp()

            }

        );


        status.textContent =
            "☁️ Firebase mein attendance save ho gayi.";

    }
    catch(error){

        console.error(error);

        status.textContent =
            "❌ Attendance error: "
            + error.message;

    }

};

            <input
                id="${id}_total"
                type="number"
                placeholder="Total"

            >

            <input
