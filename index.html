<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers Face Attendance</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1{
    font-size:25px;
}

input{
    width:90%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:95%;
    padding:12px;
    margin:6px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

video{
    width:100%;
    max-width:420px;
    margin-top:10px;
    border-radius:12px;
    background:#000;
}

#status{
    margin:15px 0;
    font-weight:bold;
}

#history{
    text-align:left;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>👨‍🏫 Teachers Face Attendance</h1>

<input type="text" id="name" placeholder="Teacher Name">

<button onclick="startCamera()">📷 Start Camera</button>

<button onclick="setSchoolLocation()">
📍 Set School Location
</button>

<button onclick="registerFace()">
👤 Register Face
</button>

<button onclick="checkFace()">
✅ Mark Attendance
</button>

<button onclick="showHistory()">
📋 Show History
</button>

<button onclick="clearHistory()">
🗑️ Clear History
</button>

<video id="camera" autoplay muted playsinline></video>

<div id="status">Loading...</div>

<div id="history"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyBguAzVWGP_GPYCsgE2",

    authDomain: "teachers-face-attendance.firebaseapp.com",

    projectId: "teachers-face-attendance",

    storageBucket: "teachers-face-attendance.firebasestorage.app",

    messagingSenderId: "63876838606",

    appId: "1:63876838606:web:572e240079865aabbc4c9f",

    measurementId: "G-XN93NKWLY5"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   FACE API
========================= */

const faceapiScript =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js";

const modelURL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

let faceapiLoaded = false;


/* =========================
   LOAD FACE API
========================= */

function loadFaceApi(){

    return new Promise((resolve,reject)=>{

        const script=document.createElement("script");

        script.src=faceapiScript;

        script.onload=async()=>{

            try{

                await faceapi.nets.tinyFaceDetector.loadFromUri(modelURL);

                await faceapi.nets.faceLandmark68Net.loadFromUri(modelURL);

                await faceapi.nets.faceRecognitionNet.loadFromUri(modelURL);

                faceapiLoaded=true;

                document.getElementById("status").innerText =
                "✅ System ready";

                resolve();

            }catch(error){

                console.error(error);

                document.getElementById("status").innerText =
                "❌ Face model load nahi hua";

                reject(error);
            }

        };

        script.onerror=()=>{

            document.getElementById("status").innerText =
            "❌ Face API load nahi hui";

            reject();
        };

        document.head.appendChild(script);

    });

}


/* =========================
   CAMERA
========================= */

let stream=null;

async function startCamera(){

    try{

        if(stream){

            stream.getTracks().forEach(track=>track.stop());

        }

        stream=await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });

        const video=document.getElementById("camera");

        video.srcObject=stream;

        await video.play();

        document.getElementById("status").innerText =
        "📷 Camera started";

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "❌ Camera permission required";

    }

}


/* =========================
   SCHOOL LOCATION
========================= */

const SCHOOL_LOCATION_DOC =
"schoolLocation";

const SCHOOL_RADIUS =
100;


/* =========================
   SET SCHOOL LOCATION
========================= */

async function setSchoolLocation(){

    if(!navigator.geolocation){

        document.getElementById("status").innerText =
        "❌ GPS is not supported";

        return;
    }


    document.getElementById("status").innerText =
    "📍 School location check ho rahi hai...";


    try{

        const oldLocation =
        await getDoc(
            doc(db,"settings",SCHOOL_LOCATION_DOC)
        );


        if(oldLocation.exists()){

            document.getElementById("status").innerText =
            "⚠️ School location already set hai.";

            alert(
                "School location pehle hi set ho chuki hai."
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(

            async(position)=>{

                const latitude =
                position.coords.latitude;

                const longitude =
                position.coords.longitude;

                const accuracy =
                position.coords.accuracy;


                try{

                    await setDoc(
                        doc(db,"settings",SCHOOL_LOCATION_DOC),
                        {

                            schoolName:
                            "Moon Star Public High School Khanwahan",

                            latitude:latitude,

                            longitude:longitude,

                            radius:SCHOOL_RADIUS,

                            accuracy:accuracy,

                            setAt:
                            new Date().toISOString()

                        }
                    );


                    document.getElementById("status").innerText =
                    "✅ School location save ho gayi";


                    alert(
                        "✅ School location successfully save ho gayi.\n\n" +
                        "GPS Accuracy: " +
                        Math.round(accuracy) +
                        " meters\n\n" +
                        "Attendance radius: 100 meters"
                    );


                }catch(error){

                    console.error(error);

                    document.getElementById("status").innerText =
                    "❌ Location Firebase mein save nahi hui";

                    alert(
                        "Firebase permission error.\n\n" +
                        error.message
                    );

                }

            },

            (error)=>{

                console.error(error);

                document.getElementById("status").innerText =
                "❌ GPS location nahi mili";

                alert(
                    "GPS location nahi mili.\n\n" +
                    "Phone ki Location ON karein aur browser ko location permission dein."
                );

            },

            {

                enableHighAccuracy:true,

                timeout:20000,

                maximumAge:0

            }

        );

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "❌ Location check error";

    }

}


/* =========================
   DISTANCE CALCULATOR
========================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;

    const dLat =
    (lat2-lat1)*Math.PI/180;

    const dLon =
    (lon2-lon1)*Math.PI/180;


    const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


    const c =
    2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );


    return R*c;

}


/* =========================
   CHECK SCHOOL LOCATION
========================= */

async function checkSchoolLocation(){

    try{

        const locationDoc =
        await getDoc(
            doc(db,"settings",SCHOOL_LOCATION_DOC)
        );


        if(!locationDoc.exists()){

            document.getElementById("status").innerText =
            "❌ School location set nahi hai";

            alert(
                "Pehle school mein jaakar 📍 Set School Location dabayein."
            );

            return false;
        }


        const school =
        locationDoc.data();


        return new Promise((resolve)=>{

            if(!navigator.geolocation){

                document.getElementById("status").innerText =
                "❌ GPS supported nahi hai";

                resolve(false);

                return;
            }


            document.getElementById("status").innerText =
            "📍 Aapki location check ho rahi hai...";


            navigator.geolocation.getCurrentPosition(

                (position)=>{

                    const currentLat =
                    position.coords.latitude;

                    const currentLon =
                    position.coords.longitude;

                    const accuracy =
                    position.coords.accuracy;


                    const distance =
                    calculateDistance(

                        school.latitude,

                        school.longitude,

                        currentLat,

                        currentLon

                    );


                    console.log(
                        "Distance:",
                        distance,
                        "Accuracy:",
                        accuracy
                    );


                    if(distance <= SCHOOL_RADIUS){

                        document.getElementById("status").innerText =
                        "✅ School location verified (" +
                        Math.round(distance) +
                        "m)";

                        resolve(true);

                    }else{

                        document.getElementById("status").innerText =
                        "❌ School se " +
                        Math.round(distance) +
                        "m door hain";

                        alert(
                            "❌ Attendance nahi lagegi.\n\n" +
                            "Aap school ke 100 meter radius mein nahi hain."
                        );

                        resolve(false);

                    }

                },

                (error)=>{

                    console.error(error);

                    document.getElementById("status").innerText =
                    "❌ Current GPS location nahi mili";

                    alert(
                        "Phone ki Location ON karein aur browser ko location permission dein."
                    );

                    resolve(false);

                },

                {

                    enableHighAccuracy:true,

                    timeout:20000,

                    maximumAge:0

                }

            );

        });


    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "❌ GPS verification error";

        return false;

    }

}


/* =========================
   REGISTER FACE
========================= */

async function registerFace(){

    if(!faceapiLoaded){

        alert("Face system abhi load ho raha hai.");

        return;
    }


    const name =
    document.getElementById("name").value.trim();


    if(!name){

        alert("Teacher name likhein.");

        return;
    }


    const video =
    document.getElementById("camera");


    document.getElementById("status").innerText =
    "👤 Face detect ho raha hai...";


    try{

        const detection =
        await faceapi
        .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize:320,
                scoreThreshold:0.4
            })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


        if(!detection){

            document.getElementById("status").innerText =
            "❌ Face detect nahi hua";

            return;
        }


        const teachersSnapshot =
        await getDocs(
            collection(db,"teachers")
        );


        let existing=false;


        teachersSnapshot.forEach(docSnap=>{

            const data=docSnap.data();

            if(
                data.name &&
                data.name.toLowerCase() ===
                name.toLowerCase()
            ){

                existing=true;

            }

        });


        if(existing){

            const confirmRegister =
            confirm(
                "Is teacher ka face pehle se registered hai.\n\nPhir bhi register karna hai?"
            );

            if(!confirmRegister){

                document.getElementById("status").innerText =
                "Registration cancelled";

                return;
            }

        }


        await addDoc(
            collection(db,"teachers"),
            {

                name:name,

                descriptor:
                Array.from(
                    detection.descriptor
                ),

                registeredAt:
                new Date().toISOString()

            }
        );


        document.getElementById("status").innerText =
        "✅ " + name + " ka face register ho gaya";

        alert(
            "✅ Face successfully registered."
        );


    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "❌ Face registration error";

        alert(error.message);

    }

}


/* =========================
   MARK ATTENDANCE
========================= */

async function checkFace(){

    if(!faceapiLoaded){

        alert("Face system abhi load ho raha hai.");

        return;
    }


    const nameInput =
    document.getElementById("name").value.trim();


    if(!nameInput){

        alert("Teacher name likhein.");

        return;
    }


    /* LOCATION FIRST */

    const locationOK =
    await checkSchoolLocation();


    if(!locationOK){

        return;
    }


    const video =
    document.getElementById("camera");


    document.getElementById("status").innerText =
    "👤 Face match ho raha hai...";


    try{

        const detection =
        await faceapi
        .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize:320,
                scoreThreshold:0.4
            })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


        if(!detection){

            document.getElementById("status").innerText =
            "❌ Face detect nahi hua";

            return;
        }


        const teachersSnapshot =
        await getDocs(
            collection(db,"teachers")
        );


        let bestMatch=null;

        let bestDistance=Infinity;


        teachersSnapshot.forEach(docSnap=>{

            const teacher =
            docSnap.data();


            if(
                !teacher.descriptor ||
                !teacher.name
            ){

                return;
            }


            const savedDescriptor =
            new Float32Array(
                teacher.descriptor
            );


            const distance =
            faceapi.euclideanDistance(
                detection.descriptor,
                savedDescriptor
            );


            if(distance < bestDistance){

                bestDistance=distance;

                bestMatch=teacher;

            }

        });


        if(
            !bestMatch ||
            bestDistance >= 0.55
        ){

            document.getElementById("status").innerText =
            "❌ Face match nahi hua";

            return;
        }


        const today =
        new Date().toLocaleDateString();


        const now =
        new Date().toLocaleTimeString();


        /* DUPLICATE CHECK */

        const attendanceSnapshot =
        await getDocs(
            collection(db,"attendance")
        );


        let alreadyPresent=false;


        attendanceSnapshot.forEach(docSnap=>{

            const record =
            docSnap.data();


            if(

                record.name &&
                record.date &&
                record.status &&

                record.name.toLowerCase() ===
                bestMatch.name.toLowerCase() &&

                record.date === today &&

                record.status === "Present"

            ){

                alreadyPresent=true;

            }

        });


        if(alreadyPresent){

            document.getElementById("status").innerText =
            "⚠️ Aaj attendance already lag chuki hai";

            alert(
                "⚠️ " +
                bestMatch.name +
                " ki aaj ki attendance already present hai."
            );

            return;
        }


        const attendance={

            name:bestMatch.name,

            status:"Present",

            date:today,

            time:now

        };


        await addDoc(

            collection(db,"attendance"),

            attendance

        );


        /* LOCAL HISTORY */

        const history =
        JSON.parse(
            localStorage.getItem("attendanceHistory") ||
            "[]"
        );


        history.push(attendance);


        localStorage.setItem(
            "attendanceHistory",
            JSON.stringify(history)
        );


        document.getElementById("status").innerText =
        "✅ Attendance marked & Firebase mein save ho gayi";


        alert(
            "✅ Attendance successful!\n\n" +
            bestMatch.name +
            "\n" +
            today +
            "\n" +
            now
        );


    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "❌ Attendance error";

        alert(
            "Attendance error:\n\n" +
            error.message
        );

    }

}


/* =========================
   HISTORY
========================= */

function showHistory(){

    const history =
    JSON.parse(
        localStorage.getItem("attendanceHistory") ||
        "[]"
    );


    const historyDiv =
    document.getElementById("history");


    if(history.length===0){

        historyDiv.innerHTML =
        "<p>No attendance history.</p>";

        return;
    }


    let html="<h3>Attendance History</h3>";


    history
    .slice()
    .reverse()
    .forEach(record=>{

        html +=
        "<p>" +
        "👤 " + record.name +
        "<br>" +
        "📅 " + record.date +
        "<br>" +
        "⏰ " + record.time +
        "<br>" +
        "✅ " + record.status +
        "</p><hr>";

    });


    historyDiv.innerHTML=html;

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory(){

    if(
        confirm(
            "Local history clear karni hai?"
        )
    ){

        localStorage.removeItem(
            "attendanceHistory"
        );

        document.getElementById("history").innerHTML =
        "";

        document.getElementById("status").innerText =
        "🗑️ Local history cleared";

    }

}


/* =========================
   BUTTON FUNCTIONS
========================= */

window.startCamera =
startCamera;

window.setSchoolLocation =
setSchoolLocation;

window.registerFace =
registerFace;

window.checkFace =
checkFace;

window.showHistory =
showHistory;

window.clearHistory =
clearHistory;


/* =========================
   START
========================= */

loadFaceApi();

</script>

</body>
</html>
