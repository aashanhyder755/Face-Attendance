<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 15px;
    }

    video {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
    }

    input {
      padding: 12px;
      font-size: 16px;
      width: 80%;
      max-width: 350px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Face Attendance</h1>

<input id="name" type="text" placeholder="Student / Teacher Name">

<br>

<button onclick="startCamera()">Start Camera</button>
<button onclick="registerFace()">Register Face</button>
<button onclick="checkFace()">Mark Attendance</button>

<br>

<video id="camera" autoplay muted playsinline></video>

<h3 id="status">Loading face recognition...</h3>

<script>

let stream = null;
let registeredDescriptor = null;
let registeredName = "";

const MODEL_URL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

async function loadModels() {
  try {
    document.getElementById("status").innerText =
      "Loading face recognition models...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

    document.getElementById("status").innerText =
      "Models loaded ✅ Start Camera";

  } catch (error) {
    console.log(error);
    document.getElementById("status").innerText =
      "Model loading error";
  }
}

async function startCamera() {

  const video = document.getElementById("camera");

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    document.getElementById("status").innerText =
      "Camera started ✅";

  } catch (error) {

    document.getElementById("status").innerText =
      "Camera error: " + error.name;

  }
}

async function registerFace() {

  const name = document.getElementById("name").value.trim();
  const video = document.getElementById("camera");

  if (!name) {
    alert("Pehle naam likhein.");
    return;
  }

  if (!stream) {
    alert("Pehle Start Camera karein.");
    return;
  }

  document.getElementById("status").innerText =
    "Face scan ho raha hai...";

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions()
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {
    document.getElementById("status").innerText =
      "Face detect nahi hua.";
    return;
  }

  registeredDescriptor = detection.descriptor;
  registeredName = name;

  document.getElementById("status").innerText =
    name + " ka face register ho gaya ✅";
}

async function checkFace() {

  if (!registeredDescriptor) {
    alert("Pehle face Register karein.");
    return;
  }

  const video = document.getElementById("camera");

  const detection =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions()
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if (!detection) {
    document.getElementById("status").innerText =
      "Face detect nahi hua.";
    return;
  }

  const distance =
    faceapi.euclideanDistance(
      registeredDescriptor,
      detection.descriptor
    );

  if (distance < 0.55) {

    const now = new Date();

    const record =
      registeredName +
      " - Present - " +
      now.toLocaleString();

    localStorage.setItem(
      "attendance",
      record
    );

    document.getElementById("status").innerText =
      "✅ " + registeredName +
      " Present - " +
      now.toLocaleString();

  } else {

    document.getElementById("status").innerText =
      "❌ Face match nahi hua.";

  }
}

loadModels();

</script>

</body>
</html>
